name: Mercury main app validation
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, mercury-full-app-main-integration]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install JSX parser
        run: npm install --no-save --no-package-lock @babel/parser
      - name: Validate Mercury main app
        run: node scripts/validate-mercury.cjs
