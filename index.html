<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mercury PCMS — Adv. Pardeep</title>
<meta name="description" content="Practice & Case Management System — Adv. Pardeep, Haryana"/>
<meta name="theme-color" content="#0d1117"/>
<link rel="manifest" href="manifest.json"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d1117;--ink2:#1c2333;--ink3:#2d3748;
  --silver:#8b9cb0;--mist:#c8d3e0;--paper:#f0f2f5;--white:#ffffff;
  --gold:#c9a84c;--gold-lt:#e8c96a;
  --teal:#1a8a7a;--rose:#c0392b;--amber:#d4891a;
  --border:rgba(139,156,176,0.2);
  --shadow:0 2px 12px rgba(13,17,23,0.08);
  --shadow-lg:0 8px 32px rgba(13,17,23,0.16);
}
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--mist);border-radius:4px}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.3)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}
.fade-up{animation:fadeUp 0.28s ease both}
input,select,textarea,button{font-family:'DM Sans',sans-serif}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef } = React;

// ─── Supabase ──────────────────────────────────────────────────────────────
const SB_URL = "https://hmtcnatqowokeyrdjujq.supabase.co";
const SB_KEY = "sb_publishable_1ErBQo9FNnHpDHkgCnUAxA_pt6ktITl";

const sbReq = (method, path, body=null) => new Promise(resolve => {
  const xhr = new XMLHttpRequest();
  xhr.open(method, `${SB_URL}/rest/v1/${path}`);
  xhr.setRequestHeader("apikey", SB_KEY);
  xhr.setRequestHeader("Authorization", `Bearer ${SB_KEY}`);
  xhr.setRequestHeader("Content-Type", "application/json");
  if(method==="POST") xhr.setRequestHeader("Prefer","return=representation,resolution=merge-duplicates");
  else if(method==="PATCH") xhr.setRequestHeader("Prefer","return=representation");
  xhr.onload = () => { try{resolve(JSON.parse(xhr.responseText))}catch(e){resolve([])} };
  xhr.onerror = () => resolve([]);
  xhr.send(body ? JSON.stringify(body) : null);
});

const sb = {
  from: t => ({
    select: (c="*") => sbReq("GET", `${t}?select=${c}&order=created_at.asc`),
    insert: d => sbReq("POST", t, d),
    update: (d, m) => sbReq("PATCH", `${t}?${Object.entries(m).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join("&")}`, d),
    delete: m => sbReq("DELETE", `${t}?${Object.entries(m).map(([k,v])=>`${k}=eq.${encodeURIComponent(v)}`).join("&")}`),
  })
};

// ─── Helpers ──────────────────────────────────────────────────────────────
const TODAY = new Date().toISOString().slice(0,10);
const todayDt = new Date(TODAY+"T00:00:00");
const daysUntil = d => Math.round((new Date(d+"T00:00:00")-todayDt)/86400000);
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtShort = d => new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short"});
const TYPE_META = {
  CS:{label:"Civil Suit",color:"#1a6aa8"},CHI:{label:"Criminal",color:"#8b2020"},
  NDPS:{label:"NDPS",color:"#5c2090"},NACT:{label:"Negotiable Act",color:"#1a5e8b"},
  COMI:{label:"Complaint",color:"#7a3010"},COMA:{label:"Complaint",color:"#7a3010"},
  HMA:{label:"Matrimonial",color:"#8b1a5e"},MNT125:{label:"Maintenance 125",color:"#8b1a5e"},
  MACP:{label:"Motor Accident",color:"#c47a1a"},EXE:{label:"Execution",color:"#1a5e3a"},
  CRA:{label:"Crim. Appeal",color:"#8b2020"},CA:{label:"Civil Appeal",color:"#1a6aa8"},
  SC:{label:"Sessions Case",color:"#8b2020"},PCH:{label:"POCSO",color:"#8b2020"},
  SUMM:{label:"Summary Trial",color:"#7a3010"},
};
const tm = t => TYPE_META[t]||{label:t,color:"#666"};
const urgency = days => {
  if(days<0) return {label:`${Math.abs(days)}d ago`,color:"#c0392b",bg:"#c0392b12"};
  if(days===0) return {label:"TODAY",color:"#c0392b",bg:"#c0392b18"};
  if(days<=3) return {label:`${days}d`,color:"#d4891a",bg:"#d4891a14"};
  if(days<=7) return {label:`${days}d`,color:"#1a8a7a",bg:"#1a8a7a12"};
  return {label:`${days}d`,color:"#8b9cb0",bg:"#8b9cb010"};
};
const pcColor = p => {
  const l=(p||"").toLowerCase();
  if(l.includes("evidence")||l.includes("statement")) return "#1a6aa8";
  if(l.includes("argument")) return "#5c2090";
  if(l.includes("charge")) return "#c0392b";
  if(l.includes("reply")||l.includes("written")) return "#1a8a7a";
  return "#8b9cb0";
};
const partyLabel = c => c.petparty_name==="XXXXXXX"?(c.note||c.type_name):`${c.petparty_name} v. ${c.resparty_name}`;
const copyCNR = (cino, notify) => {
  try{const el=document.createElement("textarea");el.value=cino;el.style.cssText="position:fixed;top:0;left:0;opacity:0;";document.body.appendChild(el);el.focus();el.select();document.execCommand("copy");document.body.removeChild(el);}catch(e){}
  notify("✅ CNR copied!","var(--gold)");
};

// ─── Icons ────────────────────────────────────────────────────────────────
const Ic = ({n,size=16,color="currentColor"}) => {
  const p = {
    home:<><rect x="3" y="10" width="18" height="11" rx="1"/><polyline points="3,10 12,3 21,10"/></>,
    list:<><line x1="9" y1="6" x2="21" y2="6"/><line x1="9" y1="12" x2="21" y2="12"/><line x1="9" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1.2" fill={color}/><circle cx="4" cy="12" r="1.2" fill={color}/><circle cx="4" cy="18" r="1.2" fill={color}/></>,
    cal:<><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></>,
    task:<><path d="M9 11l3 3 8-8"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></>,
    bar:<><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></>,
    fee:<><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6"/></>,
    search:<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>,
    plus:<><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></>,
    x:<><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></>,
    alert:<><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></>,
    copy:<><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></>,
    check:<polyline points="20 6 9 17 4 12"/>,
    trash:<><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6m4-6v6"/><path d="M9 6V4h6v2"/></>,
    filter:<path d="M22 3H2l8 9.46V19l4 2v-8.54z"/>,
    bell:<><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></>,
    save:<><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13"/><polyline points="7 3 7 8 15 8"/></>,
    sync:<><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></>,
    history:<><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></>,
    chev:<polyline points="9 18 15 12 9 6"/>,
    upload:<><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0018 9h-1.26A8 8 0 103 16.3"/></>,
  };
  return React.createElement("svg",{width:size,height:size,viewBox:"0 0 24 24",fill:"none",stroke:color,strokeWidth:"2",strokeLinecap:"round",strokeLinejoin:"round",style:{flexShrink:0}},p[n]);
};

// ─── Shared UI ────────────────────────────────────────────────────────────
const Bdg = ({label,color,bg}) => <span style={{background:bg||color+"1a",color,border:`1px solid ${color}28`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:600,letterSpacing:"0.03em",whiteSpace:"nowrap",display:"inline-block"}}>{label}</span>;

const Btn = ({children,onClick,v="gold",sm,full,style={}}) => {
  const vs={gold:{background:"var(--gold)",color:"var(--ink)"},ghost:{background:"transparent",color:"var(--ink3)",border:"1px solid var(--border)"},teal:{background:"var(--teal)",color:"#fff"},rose:{background:"var(--rose)",color:"#fff"},ink:{background:"var(--ink)",color:"var(--gold-lt)"}};
  return <button onClick={onClick} style={{cursor:"pointer",border:"none",borderRadius:7,display:"inline-flex",alignItems:"center",gap:5,fontWeight:600,transition:"opacity 0.15s",padding:sm?"4px 10px":"7px 14px",fontSize:sm?11.5:12.5,width:full?"100%":"auto",justifyContent:full?"center":"flex-start",...vs[v],...style}} onMouseEnter={e=>e.currentTarget.style.opacity="0.85"} onMouseLeave={e=>e.currentTarget.style.opacity="1"}>{children}</button>;
};

const Card = ({children,style,p=14}) => <div style={{background:"var(--white)",borderRadius:10,border:"1px solid var(--border)",boxShadow:"var(--shadow)",padding:p,...style}}>{children}</div>;
const iS = {width:"100%",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",fontSize:12.5,background:"var(--paper)",color:"var(--ink)",outline:"none"};
const Lbl = ({c}) => <div style={{fontSize:9.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>{c}</div>;
const Spin = () => <div style={{width:16,height:16,border:"2px solid var(--border)",borderTopColor:"var(--gold)",borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}/>;

// ─── MAIN APP ─────────────────────────────────────────────────────────────
function MercuryPCMS() {
  const [cases, setCases]     = useState([]);
  const [tasks, setTasks]     = useState([]);
  const [fees, setFees]       = useState([]);
  const [history, setHistory] = useState([]);
  const [view, setView]       = useState("dashboard");
  const [detail, setDetail]   = useState(null);
  const [searchQ, setSearchQ] = useState("");
  const [fDist, setFDist]     = useState("All");
  const [fType, setFType]     = useState("All");
  const [sortBy, setSortBy]   = useState("date");
  const [calMo, setCalMo]     = useState(new Date());
  const [addTask, setAddTask] = useState(null);
  const [addFee, setAddFee]   = useState(null);
  const [addCase, setAddCase] = useState(false);
  const [toast, setToast]     = useState(null);
  const [loading, setLoading] = useState(true);

  const notify = (msg, color="var(--teal)") => { setToast({msg,color}); setTimeout(()=>setToast(null),2800); };

  const loadAll = async () => {
    setLoading(true);
    try {
      const [c,t,f,h] = await Promise.all([
        sb.from("cases").select("*"),
        sb.from("tasks").select("*"),
        sb.from("fees").select("*"),
        sb.from("hearing_history").select("*"),
      ]);
      if(Array.isArray(c)) setCases(c);
      if(Array.isArray(t)) setTasks(t);
      if(Array.isArray(f)) setFees(f);
      if(Array.isArray(h)) setHistory(h);
    } catch(e) { notify("Connection error","var(--rose)"); }
    setLoading(false);
  };

  useEffect(() => { loadAll(); }, []);

  const allDists  = useMemo(() => [...new Set(cases.map(c=>c.district_name))].sort(), [cases]);
  const allTypes  = useMemo(() => [...new Set(cases.map(c=>c.type_name))].sort(), [cases]);
  const todayCases = useMemo(() => cases.filter(c=>daysUntil(c.date_next_list)===0), [cases]);
  const next7      = useMemo(() => cases.filter(c=>{const d=daysUntil(c.date_next_list);return d>=0&&d<=7;}), [cases]);
  const overdue    = useMemo(() => cases.filter(c=>daysUntil(c.date_next_list)<0), [cases]);
  const pendTasks  = useMemo(() => tasks.filter(t=>!t.done), [tasks]);

  const filtered = useMemo(() => {
    let out = [...cases];
    if(searchQ){const q=searchQ.toLowerCase();out=out.filter(c=>c.cino.toLowerCase().includes(q)||c.petparty_name.toLowerCase().includes(q)||c.resparty_name.toLowerCase().includes(q)||(c.note||"").toLowerCase().includes(q)||c.purpose_name.toLowerCase().includes(q));}
    if(fDist!=="All") out=out.filter(c=>c.district_name===fDist);
    if(fType!=="All") out=out.filter(c=>c.type_name===fType);
    if(sortBy==="date") out.sort((a,b)=>new Date(a.date_next_list)-new Date(b.date_next_list));
    if(sortBy==="type") out.sort((a,b)=>a.type_name.localeCompare(b.type_name));
    return out;
  }, [cases,searchQ,fDist,fType,sortBy]);

  const openCase = c => { setDetail(c); setView("cases"); };

  const NAV = [
    {id:"dashboard",icon:"home",  label:"Dashboard"},
    {id:"cases",    icon:"list",  label:"Cases"},
    {id:"calendar", icon:"cal",   label:"Cause List"},
    {id:"tasks",    icon:"task",  label:"Tasks"},
    {id:"fees",     icon:"fee",   label:"Fee Ledger"},
    {id:"analytics",icon:"bar",   label:"Analytics"},
  ];

  // ── DASHBOARD ────────────────────────────────────────────────────────────
  const Dashboard = () => {
    const totalFees  = fees.reduce((s,f)=>s+(parseFloat(f.amount_paid)||0),0);
    const pendingFee = fees.reduce((s,f)=>s+(parseFloat(f.amount_agreed)||0)-(parseFloat(f.amount_paid)||0),0);
    const byDist = allDists.map(d=>({d,n:cases.filter(c=>c.district_name===d).length}));
    return (
      <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:12}}>
        {/* Status */}
        <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--white)",borderRadius:8,padding:"8px 14px",border:"1px solid var(--border)"}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:loading?"#f59e0b":cases.length>0?"#22c55e":"#ef4444",flexShrink:0}}/>
          <span style={{fontSize:11.5,color:"var(--ink3)",fontWeight:500}}>
            {loading ? "⏳ Loading from Supabase…" : cases.length>0 ? `✅ ${cases.length} cases loaded from cloud` : "⚠️ No cases found"}
          </span>
          <Btn sm v="ghost" onClick={loadAll} style={{marginLeft:"auto"}}><Ic n="sync" size={12}/>Refresh</Btn>
        </div>

        {/* Stat cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10}}>
          {[
            {label:"Total Cases",    val:cases.length,         icon:"list",  color:"var(--gold)",  action:()=>setView("cases")},
            {label:"Next 7 Days",    val:next7.length,         icon:"bell",  color:"var(--amber)", action:()=>setView("calendar")},
            {label:"Today",          val:todayCases.length,    icon:"alert", color:"var(--rose)",  action:()=>setView("calendar")},
            {label:"Pending Tasks",  val:pendTasks.length,     icon:"task",  color:"var(--teal)",  action:()=>setView("tasks")},
            {label:"Fees Received",  val:`₹${(totalFees/1000).toFixed(0)}k`,icon:"fee",color:"#1a6aa8",action:()=>setView("fees")},
          ].map((s,i) => (
            <div key={i} onClick={s.action} style={{background:"var(--white)",borderRadius:10,border:"1px solid var(--border)",boxShadow:"var(--shadow)",padding:"13px 14px",cursor:"pointer",transition:"all 0.15s",animation:`fadeUp 0.28s ease ${i*0.05}s both`}}
              onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 20px rgba(0,0,0,0.12)";e.currentTarget.style.transform="translateY(-2px)";}}
              onMouseLeave={e=>{e.currentTarget.style.boxShadow="var(--shadow)";e.currentTarget.style.transform="";}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div style={{background:s.color+"18",borderRadius:6,padding:6}}><Ic n={s.icon} color={s.color} size={15}/></div>
                <span style={{fontSize:22,fontWeight:900,fontFamily:"'Playfair Display',serif",color:s.color}}>{s.val}</span>
              </div>
              <div style={{fontSize:10.5,color:"var(--silver)",fontWeight:500}}>{s.label}</div>
            </div>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr",gap:10}}>
          {/* Upcoming */}
          <Card p={0} style={{overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:7}}>
              <Ic n="bell" size={13} color="var(--amber)"/>
              <span style={{fontWeight:600,fontSize:12.5}}>Next 7 Days ({next7.length})</span>
              <Btn sm v="ghost" style={{marginLeft:"auto"}} onClick={()=>setView("calendar")}><Ic n="cal" size={11}/>Calendar</Btn>
            </div>
            <div style={{maxHeight:210,overflowY:"auto"}}>
              {next7.length===0&&<div style={{padding:20,textAlign:"center",color:"var(--silver)",fontSize:12}}>None upcoming</div>}
              {[...next7].sort((a,b)=>new Date(a.date_next_list)-new Date(b.date_next_list)).map(c=>{
                const days=daysUntil(c.date_next_list);const urg=urgency(days);const t=tm(c.type_name);
                return <div key={c.cino} style={{padding:"9px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
                  onClick={()=>openCase(c)} onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <div style={{minWidth:36,textAlign:"center",background:urg.bg,borderRadius:5,padding:"3px 0",fontSize:11,fontWeight:700,color:urg.color}}>{urg.label}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div>
                    <div style={{fontSize:10,color:"var(--silver)",marginTop:1}}>{fmtShort(c.date_next_list)} · {c.court_no_desg_name}</div>
                  </div>
                  <Bdg label={t.label} color={t.color}/>
                </div>;
              })}
            </div>
          </Card>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {/* Today */}
            <Card p={0} style={{overflow:"hidden"}}>
              <div style={{padding:"9px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:7}}>
                <Ic n="alert" size={13} color="var(--rose)"/>
                <span style={{fontWeight:600,fontSize:12.5,color:"var(--rose)"}}>Today</span>
              </div>
              {todayCases.length===0
                ?<div style={{padding:"10px 14px",fontSize:12,color:"var(--silver)"}}>No hearings today</div>
                :todayCases.map(c=><div key={c.cino} style={{padding:"8px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
                    onClick={()=>openCase(c)} onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div>
                      <div style={{fontSize:10,color:"var(--silver)"}}>{c.purpose_name}</div>
                    </div>
                    <Bdg label={tm(c.type_name).label} color={tm(c.type_name).color}/>
                  </div>)
              }
            </Card>

            {/* District */}
            <Card p={12}>
              <div style={{fontWeight:600,fontSize:12,marginBottom:10}}>By District</div>
              {byDist.map(({d,n})=>(
                <div key={d} style={{marginBottom:7,cursor:"pointer"}} onClick={()=>{setFDist(d);setView("cases");}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,marginBottom:2}}><span>{d}</span><span style={{fontWeight:700}}>{n}</span></div>
                  <div style={{background:"var(--paper)",borderRadius:3,height:4}}><div style={{height:"100%",background:"var(--gold)",borderRadius:3,width:`${(n/cases.length)*100}%`}}/></div>
                </div>
              ))}
            </Card>
          </div>
        </div>

        {/* Fee summary */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {[["Total Agreed","var(--ink3)",fees.reduce((s,f)=>s+(parseFloat(f.amount_agreed)||0),0)],["Received","var(--teal)",totalFees],["Pending","var(--rose)",Math.max(0,pendingFee)]].map(([l,c,v])=>(
            <Card key={l} p={12} style={{cursor:"pointer"}} onClick={()=>setView("fees")}>
              <div style={{fontSize:10.5,color:"var(--silver)",marginBottom:5}}>{l}</div>
              <div style={{fontSize:18,fontWeight:900,fontFamily:"'Playfair Display',serif",color:c}}>₹{v.toLocaleString("en-IN")}</div>
            </Card>
          ))}
        </div>

        {overdue.length>0&&(
          <div style={{background:"#fff5f5",border:"1px solid rgba(192,57,43,0.25)",borderRadius:8,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>setView("cases")}>
            <Ic n="alert" size={14} color="var(--rose)"/>
            <span style={{fontSize:12.5,color:"var(--rose)",fontWeight:600}}>{overdue.length} past-date hearing{overdue.length>1?"s":""} — please update next dates</span>
            <Btn sm v="rose" style={{marginLeft:"auto"}}>View</Btn>
          </div>
        )}
      </div>
    );
  };

  // ── CASES ────────────────────────────────────────────────────────────────
  const CasesView = () => (
    <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10,height:"100%"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Case Registry <span style={{fontSize:12,fontWeight:400,color:"var(--silver)"}}>{filtered.length}/{cases.length}</span></h2>
        <Btn style={{marginLeft:"auto"}} onClick={()=>setAddCase(true)}><Ic n="plus" size={13}/>Add Case</Btn>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",background:"var(--white)",borderRadius:8,padding:"8px 12px",border:"1px solid var(--border)"}}>
        <Ic n="filter" size={13} color="var(--silver)"/>
        {[[fDist,setFDist,"All Districts",allDists],[fType,setFType,"All Types",allTypes]].map(([val,set,ph,opts],i)=>(
          <select key={i} value={val} onChange={e=>set(e.target.value)} style={{...iS,width:"auto",padding:"4px 8px",fontSize:11.5}}>
            <option value="All">{ph}</option>
            {opts.map(o=><option key={o}>{o}</option>)}
          </select>
        ))}
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{...iS,width:"auto",padding:"4px 8px",fontSize:11.5}}>
          <option value="date">Sort: Date</option>
          <option value="type">Sort: Type</option>
        </select>
        {(fDist!=="All"||fType!=="All")&&<Btn sm v="ghost" onClick={()=>{setFDist("All");setFType("All");}}>Clear</Btn>}
      </div>
      <div style={{flex:1,overflow:"hidden",background:"var(--white)",borderRadius:10,border:"1px solid var(--border)",boxShadow:"var(--shadow)",display:"flex",flexDirection:"column"}}>
        <div style={{display:"grid",gridTemplateColumns:"155px 1fr 145px 110px 68px 54px",padding:"8px 14px",background:"var(--paper)",borderBottom:"1px solid var(--border)",fontSize:9.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase",letterSpacing:"0.08em",gap:8,flexShrink:0}}>
          {["CNR / Type","Parties","Court","Purpose","Date","Days"].map(h=><div key={h}>{h}</div>)}
        </div>
        <div style={{flex:1,overflowY:"auto"}}>
          {loading&&<div style={{padding:32,textAlign:"center",display:"flex",alignItems:"center",justifyContent:"center",gap:10,color:"var(--silver)"}}><Spin/>Loading from Supabase…</div>}
          {!loading&&filtered.length===0&&<div style={{padding:32,textAlign:"center",color:"var(--silver)",fontSize:13}}>No cases found</div>}
          {filtered.map((c,i)=>{
            const days=daysUntil(c.date_next_list);const urg=urgency(days);const t=tm(c.type_name);const sel=detail?.cino===c.cino;
            return <div key={c.cino} style={{display:"grid",gridTemplateColumns:"155px 1fr 145px 110px 68px 54px",padding:"9px 14px",borderBottom:"1px solid var(--border)",cursor:"pointer",gap:8,alignItems:"center",background:sel?"rgba(201,168,76,0.07)":"",transition:"background 0.1s",animation:`fadeUp 0.24s ease ${Math.min(i,25)*0.018}s both`}}
              onClick={()=>setDetail(c)} onMouseEnter={e=>!sel&&(e.currentTarget.style.background="var(--paper)")} onMouseLeave={e=>!sel&&(e.currentTarget.style.background="")}>
              <div><div className="mono" style={{fontSize:9,color:"var(--silver)",marginBottom:3}}>{c.cino}</div><Bdg label={t.label} color={t.color}/></div>
              <div>
                <div style={{fontSize:12,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div>
                {c.note&&<div style={{fontSize:9.5,color:"var(--gold)",marginTop:1}}>★ {c.note}</div>}
              </div>
              <div><div style={{fontSize:11,color:"var(--ink3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.court_no_desg_name}</div><div style={{fontSize:10,color:"var(--silver)",marginTop:1}}>{c.district_name}</div></div>
              <Bdg label={c.purpose_name} color={pcColor(c.purpose_name)}/>
              <div style={{fontSize:11,color:"var(--ink3)"}}>{fmtShort(c.date_next_list)}</div>
              <span style={{fontSize:10.5,fontWeight:700,color:urg.color,background:urg.bg,borderRadius:4,padding:"2px 5px",whiteSpace:"nowrap"}}>{urg.label}</span>
            </div>;
          })}
        </div>
      </div>
      {detail&&<DetailPanel c={detail} onClose={()=>setDetail(null)}/>}
    </div>
  );

  // ── DETAIL PANEL ─────────────────────────────────────────────────────────
  const DetailPanel = ({c,onClose}) => {
    const t=tm(c.type_name);
    const days=daysUntil(c.date_next_list);
    const urg=urgency(days);
    const caseTasks=tasks.filter(x=>x.cino===c.cino);
    const caseHistory=history.filter(x=>x.cino===c.cino).sort((a,b)=>new Date(b.hearing_date)-new Date(a.hearing_date));
    const [noteVal,setNoteVal]=useState(c.notes_adv||"");
    const [activeTab,setActiveTab]=useState("info");
    const [saving,setSaving]=useState(false);
    const [newDate,setNewDate]=useState(c.date_next_list||"");
    const [histForm,setHistForm]=useState({hearing_date:"",purpose:"",outcome:"",next_date:"",notes:""});

    const saveNote=async()=>{setSaving(true);await sb.from("cases").update({notes_adv:noteVal},{cino:c.cino});setCases(cs=>cs.map(x=>x.cino===c.cino?{...x,notes_adv:noteVal}:x));setDetail(p=>({...p,notes_adv:noteVal}));notify("✅ Notes saved");setSaving(false);};
    const updateDate=async()=>{if(!newDate)return;setSaving(true);await sb.from("cases").update({date_next_list:newDate},{cino:c.cino});setCases(cs=>cs.map(x=>x.cino===c.cino?{...x,date_next_list:newDate}:x));setDetail(p=>({...p,date_next_list:newDate}));notify("✅ Date updated!");setSaving(false);};
    const addHistory=async()=>{if(!histForm.hearing_date)return;setSaving(true);const res=await sb.from("hearing_history").insert({...histForm,cino:c.cino});if(Array.isArray(res))setHistory(h=>[...h,...res]);setHistForm({hearing_date:"",purpose:"",outcome:"",next_date:"",notes:""});notify("✅ Hearing logged");setSaving(false);};

    const TABS=["info","diary","tasks","docs","notes","cnr"];
    const [caseDocs,setCaseDocs]=useState([]);
    const [docsLoading,setDocsLoading]=useState(false);
    const fileRef=useRef(null);

    // Load docs for this case from documents table
    useEffect(()=>{
      const load=async()=>{
        setDocsLoading(true);
        const res=await sbReq("GET",`documents?cino=eq.${encodeURIComponent(c.cino)}&select=*&order=uploaded_at.desc`);
        if(Array.isArray(res))setCaseDocs(res);
        setDocsLoading(false);
      };
      load();
    },[c.cino]);

    const fileIcon=name=>{
      const ext=(name||"").split(".").pop().toLowerCase();
      if(ext==="pdf") return "📄";
      if(["doc","docx"].includes(ext)) return "📝";
      if(["jpg","jpeg","png","gif"].includes(ext)) return "🖼️";
      return "📎";
    };

    const formatSize=bytes=>{
      if(bytes<1024) return bytes+"B";
      if(bytes<1024*1024) return (bytes/1024).toFixed(1)+"KB";
      return (bytes/(1024*1024)).toFixed(1)+"MB";
    };

    const handleUpload=async(files)=>{
      const arr=Array.from(files);
      if(!arr.length) return;
      setSaving(true);
      notify("⏳ Uploading files…","var(--amber)");
      let uploaded=0;
      for(const file of arr){
        // Store file as base64 in documents table (works without Supabase Storage bucket)
        const reader=new FileReader();
        await new Promise(resolve=>{
          reader.onload=async(e)=>{
            const base64=e.target.result;
            const res=await sbReq("POST","documents",{
              cino:c.cino,
              name:file.name,
              size:file.size,
              mime_type:file.type,
              file_data:base64,
              doc_type:"general",
              uploaded_at:new Date().toISOString()
            });
            if(Array.isArray(res)&&res.length>0){setCaseDocs(d=>[res[0],...d]);uploaded++;}
            resolve();
          };
          reader.readAsDataURL(file);
        });
      }
      notify(`✅ ${uploaded} file${uploaded>1?"s":""} uploaded permanently`,"var(--teal)");
      setSaving(false);
    };

    const deleteDoc=async(id)=>{
      await sbReq("DELETE",`documents?id=eq.${id}`);
      setCaseDocs(d=>d.filter(x=>x.id!==id));
      notify("File deleted","var(--rose)");
    };

    const openDoc=doc=>{
      if(doc.file_data){
        const a=document.createElement("a");
        a.href=doc.file_data;
        a.download=doc.name;
        a.click();
      }
    };
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(13,17,23,0.42)",zIndex:200,display:"flex",justifyContent:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div style={{width:440,height:"100vh",overflowY:"auto",background:"var(--white)",boxShadow:"-6px 0 32px rgba(0,0,0,0.18)",display:"flex",flexDirection:"column",animation:"slideIn 0.25s ease"}}>
          <div style={{padding:"14px 18px 10px",borderBottom:"1px solid var(--border)",flexShrink:0}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}}>
              <div style={{flex:1,paddingRight:10}}>
                <div style={{fontSize:9.5,color:"var(--silver)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>{c.district_name} · {c.establishment_name.split(",")[0]}</div>
                <div style={{fontSize:15,fontWeight:700,lineHeight:1.35,fontFamily:"'Playfair Display',serif"}}>{partyLabel(c)}</div>
              </div>
              <button onClick={onClose} style={{border:"none",background:"var(--paper)",borderRadius:6,padding:6,cursor:"pointer"}}><Ic n="x" size={14}/></button>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              <Bdg label={t.label} color={t.color}/>
              <Bdg label={c.purpose_name} color={pcColor(c.purpose_name)}/>
              <Bdg label={urg.label} color={urg.color} bg={urg.bg}/>
              <Bdg label={fmt(c.date_next_list)} color="var(--silver)"/>
            </div>
          </div>
          <div style={{display:"flex",borderBottom:"1px solid var(--border)",flexShrink:0,overflowX:"auto"}}>
            {TABS.map(tab=><button key={tab} onClick={()=>setActiveTab(tab)} style={{flex:"none",padding:"8px 12px",border:"none",cursor:"pointer",background:"transparent",fontSize:11,fontWeight:600,color:activeTab===tab?"var(--gold)":"var(--silver)",borderBottom:activeTab===tab?"2px solid var(--gold)":"2px solid transparent",textTransform:"capitalize",whiteSpace:"nowrap"}}>
              {tab==="diary"?"📅 Diary":tab==="docs"?"📁 Docs":tab==="notes"?"🖊 Notes":tab==="cnr"?"CNR":tab==="info"?"Info":tab}
              {tab==="tasks"&&caseTasks.length>0?` (${caseTasks.length})`:""}
              {tab==="diary"&&caseHistory.length>0?` (${caseHistory.length})`:""}
              {tab==="docs"&&caseDocs.length>0?` (${caseDocs.length})`:""}
            </button>)}
          </div>
          <div style={{flex:1,overflowY:"auto",padding:"14px 18px"}}>

            {activeTab==="info"&&(
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                {[["Court",c.court_no_desg_name],["Establishment",c.establishment_name],["District",c.district_name],["Type",t.label],["Petitioner",c.petparty_name==="XXXXXXX"?"Confidential":c.petparty_name],["Respondent",c.resparty_name==="XXXXXXX"?"Confidential":c.resparty_name],["Purpose",c.purpose_name],["Next Hearing",fmt(c.date_next_list)]].map(([k,v])=>(
                  <div key={k} style={{background:"var(--paper)",borderRadius:7,padding:"9px 11px",border:"1px solid var(--border)"}}><Lbl c={k}/><div style={{fontSize:12,fontWeight:500,lineHeight:1.4}}>{v}</div></div>
                ))}
                {c.note&&<div style={{gridColumn:"1/-1",background:"#fffbef",border:"1px solid var(--gold)40",borderRadius:7,padding:"9px 11px"}}><Lbl c="Note"/><div style={{fontSize:12}}>★ {c.note}</div></div>}
                <div style={{gridColumn:"1/-1",background:"var(--paper)",borderRadius:8,padding:"10px 12px",border:"1px solid var(--border)"}}>
                  <Lbl c="Update Next Hearing Date"/>
                  <div style={{display:"flex",gap:8,alignItems:"center"}}>
                    <input type="date" value={newDate} onChange={e=>setNewDate(e.target.value)} style={{...iS,flex:1}}/>
                    <Btn sm v="teal" onClick={updateDate}>{saving?<Spin/>:<Ic n="save" size={12}/>}Save</Btn>
                  </div>
                </div>
              </div>
            )}

            {activeTab==="diary"&&(
              <div>
                <div style={{background:"var(--paper)",borderRadius:8,padding:"12px",border:"1px solid var(--border)",marginBottom:14}}>
                  <Lbl c="Log a Hearing"/>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
                    <div><Lbl c="Hearing Date"/><input type="date" value={histForm.hearing_date} onChange={e=>setHistForm(f=>({...f,hearing_date:e.target.value}))} style={iS}/></div>
                    <div><Lbl c="Purpose"/><input value={histForm.purpose} onChange={e=>setHistForm(f=>({...f,purpose:e.target.value}))} style={iS} placeholder="Evidence / Arguments…"/></div>
                    <div><Lbl c="Outcome"/><input value={histForm.outcome} onChange={e=>setHistForm(f=>({...f,outcome:e.target.value}))} style={iS} placeholder="Adjourned / Partly heard…"/></div>
                    <div><Lbl c="Next Date Fixed"/><input type="date" value={histForm.next_date} onChange={e=>setHistForm(f=>({...f,next_date:e.target.value}))} style={iS}/></div>
                    <div style={{gridColumn:"1/-1"}}><Lbl c="Notes"/><input value={histForm.notes} onChange={e=>setHistForm(f=>({...f,notes:e.target.value}))} style={iS} placeholder="Remarks…"/></div>
                  </div>
                  <Btn v="teal" onClick={addHistory}>{saving?<Spin/>:<Ic n="plus" size={12}/>}Add to Diary</Btn>
                </div>
                {caseHistory.length===0&&<div style={{textAlign:"center",color:"var(--silver)",fontSize:12,padding:20}}>No hearing history yet</div>}
                {caseHistory.map(h=>(
                  <div key={h.id} style={{background:"var(--paper)",borderRadius:8,padding:"10px 12px",border:"1px solid var(--border)",marginBottom:8}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                      <Ic n="history" size={13} color="var(--teal)"/>
                      <span style={{fontWeight:700,fontSize:12.5}}>{fmt(h.hearing_date)}</span>
                      {h.purpose&&<Bdg label={h.purpose} color={pcColor(h.purpose)}/>}
                    </div>
                    {h.outcome&&<div style={{fontSize:12,color:"var(--ink3)",marginBottom:4}}>📋 {h.outcome}</div>}
                    {h.next_date&&<div style={{fontSize:11.5,color:"var(--teal)"}}>Next: {fmt(h.next_date)}</div>}
                    {h.notes&&<div style={{fontSize:11,color:"var(--silver)",marginTop:4}}>{h.notes}</div>}
                  </div>
                ))}
              </div>
            )}

            {activeTab==="tasks"&&(
              <div>
                <div style={{display:"flex",justifyContent:"flex-end",marginBottom:10}}>
                  <Btn sm onClick={()=>setAddTask(c.cino)}><Ic n="plus" size={12}/>Add Task</Btn>
                </div>
                {caseTasks.length===0&&<div style={{textAlign:"center",color:"var(--silver)",fontSize:12,padding:20}}>No tasks for this case</div>}
                {caseTasks.map(tk=>(
                  <div key={tk.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 11px",background:tk.done?"var(--paper)":"var(--white)",border:"1px solid var(--border)",borderRadius:7,marginBottom:6}}>
                    <div style={{width:16,height:16,borderRadius:4,cursor:"pointer",flexShrink:0,border:`2px solid ${tk.done?"var(--teal)":"var(--silver)"}`,background:tk.done?"var(--teal)":"transparent",display:"flex",alignItems:"center",justifyContent:"center"}}
                      onClick={async()=>{const u=!tk.done;await sb.from("tasks").update({done:u},{id:tk.id});setTasks(ts=>ts.map(x=>x.id===tk.id?{...x,done:u}:x));}}>
                      {tk.done&&<Ic n="check" size={10} color="white"/>}
                    </div>
                    <div style={{flex:1}}><div style={{fontSize:12.5,textDecoration:tk.done?"line-through":"none",color:tk.done?"var(--silver)":"var(--ink)"}}>{tk.title}</div><div style={{fontSize:10,color:"var(--silver)",marginTop:1}}>Due {fmt(tk.due)}</div></div>
                    <button onClick={async()=>{await sb.from("tasks").delete({id:tk.id});setTasks(ts=>ts.filter(x=>x.id!==tk.id));}} style={{border:"none",background:"transparent",cursor:"pointer"}}><Ic n="trash" size={13} color="var(--rose)"/></button>
                  </div>
                ))}
              </div>
            )}

            {activeTab==="docs"&&(
              <div>
                {/* Upload zone */}
                <div
                  style={{border:"2px dashed var(--border)",borderRadius:10,padding:"22px 16px",textAlign:"center",marginBottom:14,cursor:"pointer",transition:"all 0.15s"}}
                  onClick={()=>fileRef.current&&fileRef.current.click()}
                  onDragOver={e=>{e.preventDefault();e.currentTarget.style.borderColor="var(--gold)";e.currentTarget.style.background="#fffbef";}}
                  onDragLeave={e=>{e.currentTarget.style.borderColor="";e.currentTarget.style.background="";}}
                  onDrop={e=>{e.preventDefault();e.currentTarget.style.borderColor="";e.currentTarget.style.background="";handleUpload(e.dataTransfer.files);}}
                >
                  <div style={{fontSize:28,marginBottom:8}}>📁</div>
                  <div style={{fontSize:13,fontWeight:600,color:"var(--ink3)",marginBottom:4}}>Click or Drop Files Here</div>
                  <div style={{fontSize:11,color:"var(--silver)",marginBottom:12}}>PDF, Word (.doc/.docx), Images — saved permanently to Supabase</div>
                  {/* Doc type categories */}
                  <div style={{display:"flex",flexWrap:"wrap",gap:6,justifyContent:"center",marginBottom:12}}>
                    {["Plaint","Written Statement","Evidence","Order","FIR","Vakalatnama","Other"].map(dtype=>(
                      <span key={dtype} style={{background:"var(--paper)",border:"1px solid var(--border)",borderRadius:5,padding:"3px 9px",fontSize:11,color:"var(--ink3)",cursor:"pointer"}}>{dtype}</span>
                    ))}
                  </div>
                  {saving
                    ?<div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><Spin/><span style={{fontSize:12,color:"var(--amber)"}}>Uploading…</span></div>
                    :<Btn v="gold" sm onClick={e=>{e.stopPropagation();fileRef.current&&fileRef.current.click();}}><Ic n="upload" size={13}/>Choose Files</Btn>
                  }
                  <input ref={fileRef} type="file" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.txt,.xlsx,.xls" style={{display:"none"}} onChange={e=>handleUpload(e.target.files)}/>
                </div>

                {/* File list */}
                {docsLoading&&<div style={{textAlign:"center",padding:20,display:"flex",alignItems:"center",justifyContent:"center",gap:8}}><Spin/><span style={{fontSize:12,color:"var(--silver)"}}>Loading files…</span></div>}
                {!docsLoading&&caseDocs.length===0&&(
                  <div style={{textAlign:"center",color:"var(--silver)",fontSize:12,padding:20}}>
                    No documents yet — upload plaint, WS, evidence, orders etc.
                  </div>
                )}
                {caseDocs.map((doc,i)=>(
                  <div key={doc.id||i} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:"var(--paper)",border:"1px solid var(--border)",borderRadius:8,marginBottom:8,animation:`fadeUp 0.2s ease ${i*0.03}s both`}}>
                    <span style={{fontSize:22,flexShrink:0}}>{fileIcon(doc.name)}</span>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12.5,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{doc.name}</div>
                      <div style={{fontSize:10,color:"var(--silver)",marginTop:2}}>
                        {formatSize(doc.size)} · {new Date(doc.uploaded_at).toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})}
                      </div>
                    </div>
                    {doc.file_data&&(
                      <button onClick={()=>openDoc(doc)} title="Download" style={{border:"none",background:"var(--teal)18",borderRadius:6,padding:"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:4,fontSize:11,color:"var(--teal)",fontWeight:600}}>
                        <Ic n="save" size={13} color="var(--teal)"/>Open
                      </button>
                    )}
                    <button onClick={()=>deleteDoc(doc.id)} title="Delete" style={{border:"none",background:"transparent",cursor:"pointer",padding:4}}>
                      <Ic n="trash" size={14} color="var(--rose)"/>
                    </button>
                  </div>
                ))}

                {caseDocs.length>0&&(
                  <div style={{marginTop:8,padding:"8px 12px",background:"#f0fff4",border:"1px solid #86efac",borderRadius:7,fontSize:11,color:"#166534"}}>
                    ✅ {caseDocs.length} file{caseDocs.length>1?"s":""} stored permanently in Supabase
                  </div>
                )}
              </div>
            )}

            {activeTab==="notes"&&(
              <div>
                <Lbl c="Advocate Notes (saved to Supabase)"/>
                <textarea value={noteVal} onChange={e=>setNoteVal(e.target.value)} rows={10} placeholder="Strategy, witness list, arguments, instructions…" style={{...iS,resize:"vertical",lineHeight:1.6}}/>
                <div style={{textAlign:"right",marginTop:8}}><Btn v="teal" sm onClick={saveNote}>{saving?<Spin/>:<Ic n="save" size={12}/>}Save to Cloud</Btn></div>
              </div>
            )}

            {activeTab==="cnr"&&(
              <div style={{display:"flex",flexDirection:"column",gap:10}}>
                <div style={{background:"var(--ink)",borderRadius:9,padding:16}}>
                  <div style={{fontSize:9.5,color:"var(--silver)",marginBottom:8,textTransform:"uppercase",letterSpacing:"0.06em"}}>CNR Number</div>

  // ── CALENDAR ─────────────────────────────────────────────────────────────
  const CalendarView = () => {
    const y=calMo.getFullYear(),m=calMo.getMonth();
    const firstDay=new Date(y,m,1).getDay();
    const daysInMo=new Date(y,m+1,0).getDate();
    const byDate={};
    cases.forEach(c=>{const d=c.date_next_list;if(d&&new Date(d).getFullYear()===y&&new Date(d).getMonth()===m){if(!byDate[d])byDate[d]=[];byDate[d].push(c);}});
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMo;d++)cells.push(d);
    return (
      <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10,height:"100%"}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Cause List Calendar</h2>
          <div style={{marginLeft:"auto",display:"flex",gap:6}}>
            <Btn sm v="ghost" onClick={()=>setCalMo(new Date(y,m-1,1))}>← Prev</Btn>
            <span style={{padding:"4px 10px",fontWeight:600,fontSize:13}}>{calMo.toLocaleString("en-IN",{month:"long",year:"numeric"})}</span>
            <Btn sm v="ghost" onClick={()=>setCalMo(new Date(y,m+1,1))}>Next →</Btn>
          </div>
        </div>
        <Card p={0} style={{overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:"1px solid var(--border)"}}>
            {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} style={{textAlign:"center",padding:"6px 2px",fontSize:9.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
            {cells.map((day,i)=>{
              if(!day)return<div key={`e${i}`} style={{minHeight:68,borderBottom:"1px solid var(--border)",borderRight:"1px solid var(--border)",background:"#f9fafb"}}/>;
              const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
              const isToday=ds===TODAY;
              const hearings=byDate[ds]||[];
              return <div key={day} style={{minHeight:68,borderBottom:"1px solid var(--border)",borderRight:"1px solid var(--border)",padding:5,background:isToday?"#fffbef":hearings.length?"#f9fff9":""}}>
                <div style={{width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:3,fontSize:11,fontWeight:isToday?700:400,background:isToday?"var(--gold)":"transparent",color:isToday?"white":"var(--ink3)"}}>{day}</div>
                {hearings.slice(0,2).map(h=>{const t=tm(h.type_name);return<div key={h.cino} onClick={()=>openCase(h)} style={{fontSize:9,padding:"1px 3px",borderRadius:3,marginBottom:2,background:t.color+"1a",color:t.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500,cursor:"pointer"}}>{h.resparty_name==="XXXXXXX"?(h.note||h.type_name):h.resparty_name}</div>;})}
                {hearings.length>2&&<div style={{fontSize:8.5,color:"var(--silver)"}}>+{hearings.length-2}</div>}
              </div>;
            })}
          </div>
        </Card>
        <div style={{flex:1,overflowY:"auto"}}>
          {Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).map(([date,hearings])=>(
            <div key={date} style={{marginBottom:12}}>
              <div style={{fontSize:10.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>
                {fmt(date)}{date===TODAY&&<span style={{color:"var(--rose)",marginLeft:6}}>— TODAY</span>}<span style={{fontWeight:400,marginLeft:6}}>({hearings.length})</span>
              </div>
              <Card p={0} style={{overflow:"hidden"}}>
                {hearings.map((c,i)=>{const t=tm(c.type_name);return(
                  <div key={c.cino} style={{padding:"9px 14px",borderBottom:i<hearings.length-1?"1px solid var(--border)":"none",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}
                    onClick={()=>openCase(c)} onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                    <div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div><div style={{fontSize:10.5,color:"var(--silver)",marginTop:1}}>{c.court_no_desg_name} · {c.establishment_name}</div></div>
                    <Bdg label={t.label} color={t.color}/><Bdg label={c.purpose_name} color={pcColor(c.purpose_name)}/>

        </div>

          <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Tasks & Reminders</h2>

        </div>
        <div style={{flex:1,overflowY:"auto",display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,alignContent:"start"}}>
          <Card p={0} style={{overflow:"hidden",alignSelf:"start"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border)",fontWeight:600,fontSize:13,display:"flex",gap:7,alignItems:"center"}}><Ic n="alert" size={13} color="var(--rose)"/>Pending ({pend.length})</div>

                <div style={{flex:1}}><div style={{fontSize:12.5,fontWeight:500}}>{tk.title}</div>{c&&<div style={{fontSize:11,color:"var(--gold)",marginTop:1,cursor:"pointer"}} onClick={()=>openCase(c)}>{partyLabel(c)}</div>}<div style={{fontSize:11,color:"var(--silver)",marginTop:1}}>Due {fmt(tk.due)}</div></div>
                <button onClick={async()=>{await sb.from("tasks").delete({id:tk.id});setTasks(ts=>ts.filter(x=>x.id!==tk.id));}} style={{border:"none",background:"transparent",cursor:"pointer"}}><Ic n="trash" size={13} color="var(--rose)"/></button>
              </div>
            );})}
          </Card>
          <Card p={0} style={{overflow:"hidden",alignSelf:"start"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border)",fontWeight:600,fontSize:13,display:"flex",gap:7,alignItems:"center"}}><Ic n="check" size={13} color="var(--teal)"/>Done ({done.length})</div>
            {done.length===0&&<div style={{padding:24,textAlign:"center",color:"var(--silver)",fontSize:12}}>No completed tasks</div>}
            {done.map(tk=>(
              <div key={tk.id} style={{padding:"9px 14px",borderBottom:"1px solid var(--border)",display:"flex",gap:8,alignItems:"center",opacity:0.55}}>
                <div style={{width:16,height:16,borderRadius:4,background:"var(--teal)",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}} onClick={async()=>{await sb.from("tasks").update({done:false},{id:tk.id});setTasks(ts=>ts.map(x=>x.id===tk.id?{...x,done:false}:x));}}>
                  <Ic n="check" size={10} color="white"/>
                </div>
                <div style={{flex:1,fontSize:12.5,textDecoration:"line-through"}}>{tk.title}</div>
              </div>
            ))}
          </Card>
        </div>
      </div>
    );
  };

  // ── FEE LEDGER ───────────────────────────────────────────────────────────

      <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10,height:"100%"}}>

          <Btn style={{marginLeft:"auto"}} onClick={()=>setAddFee(true)}><Ic n="plus" size={14}/>Add Entry</Btn>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {[["Total Agreed","var(--ink3)",total],["Received","var(--teal)",recv],["Pending","var(--rose)",Math.max(0,pending)]].map(([l,c,v])=>(
            <Card key={l} p={14}><div style={{fontSize:11,color:"var(--silver)",marginBottom:6}}>{l}</div><div style={{fontSize:22,fontWeight:900,fontFamily:"'Playfair Display',serif",color:c}}>₹{v.toLocaleString("en-IN")}</div></Card>

              {["Client / Case","Description","Agreed","Paid","Balance"].map(h=><div key={h}>{h}</div>)}
            </div>
            {fees.length===0&&<div style={{padding:32,textAlign:"center",color:"var(--silver)",fontSize:13}}>No fee entries yet</div>}
            {fees.map((f,i)=>{
              const bal=(parseFloat(f.amount_agreed)||0)-(parseFloat(f.amount_paid)||0);
              const c=cases.find(x=>x.cino===f.cino);

                <div style={{fontSize:11.5,color:"var(--ink3)"}}>{f.description||"—"}</div>
                <div style={{fontSize:12,fontWeight:600}}>₹{(parseFloat(f.amount_agreed)||0).toLocaleString("en-IN")}</div>

        </div>

  // ── ANALYTICS ────────────────────────────────────────────────────────────
  const AnalyticsView = () => {
    const byType=allTypes.map(t=>({t,n:cases.filter(c=>c.type_name===t).length,meta:tm(t)})).sort((a,b)=>b.n-a.n);
    const byMo={};cases.forEach(c=>{const mo=c.date_next_list?.slice(0,7);if(mo)byMo[mo]=(byMo[mo]||0)+1;});
    const mos=Object.entries(byMo).sort(([a],[b])=>a.localeCompare(b));
    const maxMo=Math.max(...mos.map(([,n])=>n),1);
    const maxType=Math.max(...byType.map(x=>x.n),1);
    return (
      <div className="fade-up" style={{overflowY:"auto",height:"100%"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700,marginBottom:12}}>Analytics</h2>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
          <Card p={14} style={{gridColumn:"1/-1"}}>
            <div style={{fontWeight:600,fontSize:13,marginBottom:12}}>Hearing Timeline</div>

              {mos.map(([mo,n])=>(
                <div key={mo} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
                  <div style={{fontSize:10,fontWeight:700,color:"var(--ink3)"}}>{n}</div>
                  <div style={{width:"100%",borderRadius:"3px 3px 0 0",background:mo===TODAY.slice(0,7)?"var(--gold)":"var(--teal)",height:`${(n/maxMo)*64}px`,transition:"height 0.4s"}}/>

                <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,marginBottom:3}}><span>{meta.label}<span style={{color:"var(--silver)",fontSize:9.5,marginLeft:4}}>({t})</span></span><span style={{fontWeight:700}}>{n}</span></div>
                <div style={{background:"var(--paper)",borderRadius:3,height:4}}><div style={{height:"100%",background:meta.color,borderRadius:3,width:`${(n/maxType)*100}%`}}/></div>

          <Card p={14}>

          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:16}}>Add New Case</h2><button onClick={()=>setAddCase(false)} style={{border:"none",background:"var(--paper)",borderRadius:6,padding:5,cursor:"pointer"}}><Ic n="x" size={14}/></button></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Lbl c="CNR Number"/><input value={form.cino} onChange={e=>setForm(f=>({...f,cino:e.target.value}))} style={iS} placeholder="HRKR…"/></div>
            <div><Lbl c="Case Type"/><select value={form.type_name} onChange={e=>setForm(f=>({...f,type_name:e.target.value}))} style={iS}>{["CS","CHI","NDPS","NACT","COMI","HMA","MNT125","MACP","EXE","CRA","CA","SC","SUMM","PCH"].map(t=><option key={t}>{t}</option>)}</select></div>
            <div><Lbl c="Petitioner"/><input value={form.petparty_name} onChange={e=>setForm(f=>({...f,petparty_name:e.target.value}))} style={iS}/></div>
            <div><Lbl c="Respondent"/><input value={form.resparty_name} onChange={e=>setForm(f=>({...f,resparty_name:e.target.value}))} style={iS}/></div>
            <div><Lbl c="Court"/><input value={form.court_no_desg_name} onChange={e=>setForm(f=>({...f,court_no_desg_name:e.target.value}))} style={iS} placeholder="JM-1st Class…"/></div>
            <div><Lbl c="District"/><select value={form.district_name} onChange={e=>setForm(f=>({...f,district_name:e.target.value}))} style={iS}>{["Karnal","Ambala","Kurukshetra","Sonepat","Chandigarh","Yamunanagar","Panipat"].map(d=><option key={d}>{d}</option>)}</select></div>
            <div style={{gridColumn:"1/-1"}}><Lbl c="Establishment"/><input value={form.establishment_name} onChange={e=>setForm(f=>({...f,establishment_name:e.target.value}))} style={iS} placeholder="Criminal Courts, Karnal"/></div>
            <div><Lbl c="Next Hearing"/><input type="date" value={form.date_next_list} onChange={e=>setForm(f=>({...f,date_next_list:e.target.value}))} style={iS}/></div>
            <div><Lbl c="Purpose"/><input value={form.purpose_name} onChange={e=>setForm(f=>({...f,purpose_name:e.target.value}))} style={iS}/></div>
            <div style={{gridColumn:"1/-1"}}><Lbl c="Note"/><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} style={iS} placeholder="e.g. Komal vs Kapil"/></div>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><Btn v="ghost" onClick={()=>setAddCase(false)}>Cancel</Btn><Btn onClick={add}>{saving?<Spin/>:<Ic n="save" size={13}/>}Save to Supabase</Btn></div>
        </div>
      </div>
    );
  };

  // ── LAYOUT ───────────────────────────────────────────────────────────────
  return (
    <div style={{display:"flex",height:"100vh",overflow:"hidden",background:"var(--paper)"}}>
      {/* Sidebar */}
      <nav style={{width:175,minWidth:175,flexShrink:0,background:"#141b27",display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
        <div style={{padding:"14px 14px 12px",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontWeight:900,fontSize:18,background:"linear-gradient(135deg,#c9a84c,#e8c96a)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>⚖ MERCURY</div>
          <div style={{fontSize:9,color:"#8b9cb0",letterSpacing:"0.12em",textTransform:"uppercase",marginTop:3}}>PCMS · Adv. Pardeep</div>
        </div>
        <div style={{flex:1,paddingTop:4}}>
          {NAV.map(n=>(
            <div key={n.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px",cursor:"pointer",transition:"all 0.15s",background:view===n.id?"rgba(201,168,76,0.12)":"transparent",borderLeft:view===n.id?"3px solid #c9a84c":"3px solid transparent",color:view===n.id?"#e8c96a":"#8b9cb0",fontSize:12,fontWeight:view===n.id?600:400}}
              onClick={()=>{setView(n.id);if(n.id!=="cases")setDetail(null);}}>
              <Ic n={n.icon} size={14} color={view===n.id?"#e8c96a":"#8b9cb0"}/>
              {n.label}
              {n.id==="tasks"&&pendTasks.length>0&&<span style={{marginLeft:"auto",background:"#1a8a7a",color:"white",borderRadius:8,padding:"0 5px",fontSize:9.5,fontWeight:700}}>{pendTasks.length}</span>}
              {n.id==="dashboard"&&next7.length>0&&<span style={{marginLeft:"auto",background:"#d4891a",color:"white",borderRadius:8,padding:"0 5px",fontSize:9.5,fontWeight:700}}>{next7.length}</span>}
            </div>
          ))}
        </div>
        <div style={{padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:6}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg,#c9a84c,#e8c96a)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,color:"#0d1117",flexShrink:0}}>P</div>
            <div><div style={{color:"#fff",fontWeight:600,fontSize:11.5}}>Adv. Pardeep</div><div style={{fontSize:9,color:"#8b9cb0"}}>Haryana Bar</div></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:loading?"#f59e0b":cases.length>0?"#22c55e":"#ef4444"}}/>
            <span style={{fontSize:9,color:"#8b9cb0"}}>{cases.length>0?`${cases.length} cases in cloud`:"Connecting…"}</span>
          </div>
        </div>
      </nav>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div style={{background:"var(--white)",borderBottom:"1px solid var(--border)",padding:"10px 18px",display:"flex",alignItems:"center",gap:12,flexShrink:0,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
          <div style={{flex:1,maxWidth:340,display:"flex",alignItems:"center",gap:7,background:"var(--paper)",border:"1px solid var(--border)",borderRadius:7,padding:"6px 11px"}}>
            <Ic n="search" size={13} color="var(--silver)"/>
            <input style={{border:"none",background:"transparent",outline:"none",fontSize:12.5,color:"var(--ink)",flex:1}} placeholder="Search CNR, party, type…" value={searchQ} onChange={e=>{setSearchQ(e.target.value);if(e.target.value)setView("cases");}}/>
            {searchQ&&<button onClick={()=>setSearchQ("")} style={{border:"none",background:"transparent",cursor:"pointer"}}><Ic n="x" size={12} color="var(--silver)"/></button>}
          </div>
          {todayCases.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:6,background:"#fff2f2",border:"1px solid rgba(192,57,43,0.22)",borderRadius:7,padding:"5px 10px",fontSize:11.5,color:"var(--rose)",fontWeight:700,cursor:"pointer",animation:"pulse 2s infinite"}} onClick={()=>setView("calendar")}>
              <Ic n="alert" size={12} color="var(--rose)"/>{todayCases.length} hearing{todayCases.length>1?"s":""} today
            </div>
          )}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:loading?"#f59e0b":"#22c55e"}}/>
            <span style={{fontSize:10.5,color:"var(--silver)"}}>{loading?"Syncing…":"Supabase ✓"}</span>
          </div>
          <div style={{fontSize:11,color:"var(--silver)",whiteSpace:"nowrap"}}>{new Date().toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</div>
        </div>

        <div style={{flex:1,overflow:"hidden",padding:"14px 18px",display:"flex",flexDirection:"column"}}>
          {view==="dashboard"  &&<Dashboard/>}
          {view==="cases"      &&<CasesView/>}
          {view==="calendar"   &&<CalendarView/>}
          {view==="tasks"      &&<TasksView/>}
          {view==="fees"       &&<FeesView/>}
          {view==="analytics"  &&<AnalyticsView/>}
        </div>
      </div>

      {addTask&&<AddTaskModal/>}
      {addFee&&<AddFeeModal/>}
      {addCase&&<AddCaseModal/>}

      {toast&&<div style={{position:"fixed",bottom:18,right:18,background:"#1c2333",color:"#fff",padding:"10px 16px",borderRadius:9,fontSize:12.5,fontWeight:500,boxShadow:"var(--shadow-lg)",borderLeft:`4px solid ${toast.color}`,animation:"fadeUp 0.25s ease",zIndex:400}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(MercuryPCMS));
</script>
</body>
</html>
