<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#0d1117;--ink2:#1c2333;--ink3:#2d3748;
  --silver:#8b9cb0;--mist:#c8d3e0;--paper:#f0f2f5;--white:#ffffff;
  --gold:#c9a84c;--gold-lt:#e8c96a;
  --teal:#1a8a7a;--rose:#c0392b;--amber:#d4891a;
  --border:rgba(139,156,176,0.2);
  --shadow:0 2px 12px rgba(13,17,23,0.08);
  --shadow-lg:0 8px 32px rgba(13,17,23,0.16);
}
html,body,#root{height:100%;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--paper);color:var(--ink);overflow:hidden}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-thumb{background:var(--mist);border-radius:4px}
.mono{font-family:'JetBrains Mono',monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(192,57,43,0.3)}50%{box-shadow:0 0 0 6px rgba(192,57,43,0)}}
.fade-up{animation:fadeUp 0.28s ease both}
/* ── Mercury mobile workspace ─────────────────────────────────────────── */
.mercury-mobile-nav{display:none}
.mercury-sidebar{width:175px;min-width:175px}
.mercury-topbar{min-height:52px}
.mercury-main-pad{padding:14px 18px}
.mercury-case-sheet{width:440px}
  .mercury-dashboard{--md-ink:#172438;--md-muted:#687588}
  .mercury-welcome{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:stretch;justify-content:space-between;gap:20px;min-height:205px;padding:25px 28px;border-radius:16px;color:#fff;background:linear-gradient(115deg,#15243a 0%,#203d58 62%,#285d68 100%);box-shadow:0 12px 30px rgba(23,36,56,.13)}
  .mercury-welcome:after{content:"";position:absolute;z-index:-1;width:330px;height:330px;right:17%;top:-205px;border:1px solid rgba(255,255,255,.10);border-radius:50%;box-shadow:0 0 0 28px rgba(255,255,255,.025),0 0 0 58px rgba(255,255,255,.02)}
  .mercury-welcome-copy{max-width:620px;min-width:0}
  .mercury-eyebrow{display:flex;align-items:center;gap:8px;font-size:9px;font-weight:800;letter-spacing:1.8px;color:#d6c39a}
  .mercury-live-dot{width:7px;height:7px;border-radius:50%;background:#80d5b4;box-shadow:0 0 0 4px rgba(128,213,180,.13)}
  .mercury-eyebrow-divider{color:rgba(255,255,255,.32)}
  .mercury-welcome h1{font-family:'Playfair Display',Georgia,serif;font-size:clamp(26px,3vw,36px);line-height:1.16;letter-spacing:-.5px;margin:18px 0 8px;color:#fff}
  .mercury-welcome p{font-size:12.5px;line-height:1.7;color:rgba(255,255,255,.76);margin:0;max-width:460px}
  .mercury-welcome-date{display:flex;align-items:center;gap:8px;font-size:11px;color:#f0dfbb;margin-top:18px}
  .mercury-welcome-mark{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:180px;max-width:230px;padding:8px 14px;color:rgba(255,255,255,.7);text-align:center}
  .mercury-mark-ring{display:grid;place-items:center;width:76px;height:76px;border-radius:50%;border:1px solid rgba(222,201,154,.58);color:#e4d1a4;background:rgba(255,255,255,.035);box-shadow:0 0 0 8px rgba(255,255,255,.025),inset 0 0 0 5px rgba(255,255,255,.025)}
  .mercury-welcome-mark>span{font-size:8px;letter-spacing:2px;font-weight:800;margin-top:15px;color:#dfcda5}
  .mercury-welcome-mark>strong{font-family:'Playfair Display',Georgia,serif;font-weight:500;font-size:12px;margin-top:5px;color:rgba(255,255,255,.8)}
  .mercury-quick-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
  .mercury-quick-actions>button{min-width:0;display:flex;align-items:center;gap:10px;padding:13px 12px;border:1px solid var(--border);border-radius:11px;background:var(--white);color:var(--ink3);text-align:left;cursor:pointer;box-shadow:0 2px 7px rgba(20,30,45,.025);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease}

  .mercury-quick-actions>button>span:nth-child(2){display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
  .mercury-quick-actions>button strong{font-size:11px;font-weight:750;color:var(--ink)}
  .mercury-quick-actions>button small{font-size:9.5px;line-height:1.4;color:var(--silver)}
  .mercury-action-icon{display:grid;place-items:center;flex-shrink:0;width:34px;height:34px;border-radius:9px;background:#f2efe7;color:#8b7443}

@media print {
  body,#root{height:auto!important;overflow:visible!important;background:#fff!important}
  .mercury-sidebar,.mercury-topbar,.mercury-mobile-nav,button,input,select,textarea{display:none!important}
  .mercury-main-pad{height:auto!important;overflow:visible!important;padding:0!important}
  .mercury-main-pad>div{height:auto!important;overflow:visible!important}
  .fade-up{animation:none!important}
  *{box-shadow:none!important}
}
@media (max-width: 700px){
  html,body,#root{height:100%;width:100%;overflow:hidden}
  body{padding-bottom:env(safe-area-inset-bottom,0px)}
  .mercury-sidebar{display:none !important}
  .mercury-topbar{padding:8px 10px !important;min-height:48px !important;gap:7px !important}
  .mercury-topbar .mercury-search{max-width:none !important;width:100% !important;padding:7px 9px !important}

  .mercury-mobile-nav{display:flex;position:fixed;left:0;right:0;bottom:var(--mercury-system-bottom-safe, env(safe-area-inset-bottom,0px));z-index:500;height:64px;padding:5px 8px;background:rgba(20,27,39,.98);border-top:1px solid rgba(255,255,255,.10);box-shadow:0 -6px 24px rgba(0,0,0,.16);gap:4px}
  .mercury-mobile-nav button{flex:1;border:0;background:transparent;color:#8b9cb0;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:9px;font-weight:600;cursor:pointer;min-width:0;touch-action:manipulation}
  .mercury-mobile-nav button.active{color:#e8c96a;background:rgba(201,168,76,.12)}
  .mercury-mobile-nav .nav-count{font-size:8px;background:#d4891a;color:#fff;border-radius:8px;padding:0 4px;margin-left:2px}
  .mercury-case-sheet{width:100% !important;max-width:none !important;height:100dvh !important;height:100vh !important;border-radius:0 !important}
  .mercury-case-sheet .case-sheet-scroll{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px)) !important}
  #root [style*="grid-template-columns"]{grid-template-columns:1fr !important}
  #root [style*="grid-template-columns"] > *{grid-column:auto !important}
  .mercury-case-sheet .case-tabs{position:sticky;top:0;z-index:3;background:var(--white)}
  .mercury-case-sheet .case-tabs button{padding:10px 13px !important;min-height:42px}
  .mercury-case-sheet .case-header-title{font-size:14px !important}
  .mercury-case-sheet .case-header{padding:12px 12px 9px !important}
  .mercury-case-sheet .case-sheet-scroll{padding:12px !important}
  .mercury-case-sheet .ai-height{height:calc(100dvh - 250px) !important}
  button{touch-action:manipulation}
}
@media (min-width:701px) and (max-width:900px){.mercury-sidebar{width:150px;min-width:150px}.mercury-main-pad{padding:10px 12px}.mercury-case-sheet{width:400px}}

input,select,textarea,button{font-family:'DM Sans',sans-serif}

<div id="root"></div>
<script>
  window.addEventListener('error', function(e) {
    if (document.getElementById('root').innerHTML === '') {
      document.getElementById('root').innerHTML =
        '<div style="padding:40px;font-family:monospace;color:#c0392b;background:#fff5f5;min-height:100vh;">' +
        '<h2>⚠️ Script Error</h2><p>' + (e.message || 'Unknown error') + '</p>' +
        '<p style="color:#666;font-size:12px;">Line: ' + (e.lineno||'?') + ', File: ' + (e.filename||'?') + '</p>' +
        '<p style="margin-top:20px;">Please screenshot this and share with support.</p></div>';
    }
  });
</script>

const sbReq = async (method,path,body=null) => {
 const result=await authClient.auth.getSession(); const session=result.data&&result.data.session;
 if(!session||!session.access_token) throw new Error("Please sign in to Mercury.");
 const headers={apikey:SB_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json",Accept:"application/json"};
 if(method==="POST") headers.Prefer="return=representation,resolution=merge-duplicates"; else if(method==="PATCH") headers.Prefer="return=representation";
 const response=await fetch(SB_URL+"/rest/v1/"+path,{method:method,headers:headers,body:body?JSON.stringify(body):undefined});
 const payload=await response.json().catch(()=>null); if(!response.ok) throw new Error((payload&&(payload.message||payload.hint))||("Supabase request failed ("+response.status+")")); return payload;
};
const sb={from:t=>({select:(c="*")=>sbReq("GET",t+"?select="+c+"&order=created_at.asc"),insert:d=>sbReq("POST",t,d),update:(d,m)=>sbReq("PATCH",t+"?"+Object.entries(m).map(([k,v])=>k+"=eq."+encodeURIComponent(v)).join("&"),d),delete:m=>sbReq("DELETE",t+"?"+Object.entries(m).map(([k,v])=>k+"=eq."+encodeURIComponent(v)).join("&"))})};

const todayDt = new Date(TODAY+"T00:00:00");
const daysUntil = d => Math.round((new Date(d+"T00:00:00")-todayDt)/86400000);
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"}) : "—";
const fmtShort = d => new Date(d+"T00:00:00").toLocaleDateString("en-IN",{day:"2-digit",month:"short"});
const TYPE_META = {
  CS:{label:"Civil Suit",color:"#1a6aa8"},CHI:{label:"Criminal",color:"#8b2020"},
  NDPS:{label:"NDPS",color:"#5c2090"},NACT:{label:"Negotiable Act",color:"#1a5e8b"},
  COMI:{label:"Complaint",color:"#7a3010"},COMA:{label:"Complaint",color:"#7a3010"},
  HMA:{label:"Matrimonial",color:"#8b1a5e"},MNT125:{label:"Maintenance 125",color:"#8b1a5e"},
  MACP:{label:"Motor Accident",color:"#c47a1a"},EXE:{label:"Execution",color:"#1a5e3a"},
  CRA:{label:"Crim. Appeal",color:"#8b2020"},CA:{label:"Civil Appeal",color:"#1a6aa8"},
  SC:{label:"Sessions Case",color:"#8b2020"},PCH:{label:"POCSO",color:"#8b2020"},
  SUMM:{label:"Summary Trial",color:"#7a3010"},
};
const tm = t => TYPE_META[t]||{label:t,color:"#666"};
const urgency = days => {
  if(days<0) return {label:`${Math.abs(days)}d ago`,color:"#c0392b",bg:"#c0392b12"};
  if(days===0) return {label:"TODAY",color:"#c0392b",bg:"#c0392b18"};
  if(days<=3) return {label:`${days}d`,color:"#d4891a",bg:"#d4891a14"};
  if(days<=7) return {label:`${days}d`,color:"#1a8a7a",bg:"#1a8a7a12"};
  return {label:`${days}d`,color:"#8b9cb0",bg:"#8b9cb010"};
};
const pcColor = p => {
  const l=(p||"").toLowerCase();
  if(l.includes("evidence")||l.includes("statement")) return "#1a6aa8";
  if(l.includes("argument")) return "#5c2090";
  if(l.includes("charge")) return "#c0392b";
  if(l.includes("reply")||l.includes("written")) return "#1a8a7a";
  return "#8b9cb0";
};
const partyLabel = c => c.petparty_name==="XXXXXXX"?(c.note||c.type_name):`${c.petparty_name} v. ${c.resparty_name}`;
const csvCell = value => {
  let v = value == null ? "" : String(value);
  if (/^[=+@\- \t\r]/.test(v)) v = "'" + v;
  return '"' + v.replace(/"/g, '""') + '"';
};
const downloadCsv = (filename, rows) => {
  if (!rows || !rows.length) return false;
  const keys = [...new Set(rows.flatMap(row => Object.keys(row)))];
  const csv = "\uFEFF" + [keys.map(csvCell).join(","), ...rows.map(row => keys.map(k => csvCell(row[k])).join(","))].join("\r\n");
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); return true;
};

};

// ─── Shared UI ────────────────────────────────────────────────────────────
const Bdg = ({label,color,bg}) => <span style={{background:bg||color+"1a",color,border:`1px solid ${color}28`,borderRadius:4,padding:"1px 6px",fontSize:10,fontWeight:600,letterSpacing:"0.03em",whiteSpace:"nowrap",display:"inline-block"}}>{label}</span>;

const Card = ({children,style,p=14}) => <div style={{background:"var(--white)",borderRadius:10,border:"1px solid var(--border)",boxShadow:"var(--shadow)",padding:p,...style}}>{children}</div>;
const iS = {width:"100%",border:"1px solid var(--border)",borderRadius:6,padding:"7px 10px",fontSize:12.5,background:"var(--paper)",color:"var(--ink)",outline:"none"};
const Lbl = ({c}) => <div style={{fontSize:9.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:4}}>{c}</div>;
const Spin = () => <div style={{width:16,height:16,border:"2px solid var(--border)",borderTopColor:"var(--gold)",borderRadius:"50%",animation:"spin 0.8s linear infinite",flexShrink:0}}/>;

// ─── MAIN APP ─────────────────────────────────────────────────────────────
function MercuryPCMS() {
  const [cases, setCases]     = useState([]);
  const [tasks, setTasks]     = useState([]);
  const [fees, setFees]       = useState([]);
  const [history, setHistory] = useState([]);
  const [reminders, setReminders] = useState([]);
  const [officeRefresh,setOfficeRefresh] = useState(0);
  const [view, setView]       = useState("dashboard");
  const [detail, setDetail]   = useState(null);
  const [searchQ, setSearchQ] = useState("");
  const [fDist, setFDist]     = useState("All");
  const [fType, setFType]     = useState("All");
  const [sortBy, setSortBy]   = useState("date");
  const [calMo, setCalMo]     = useState(new Date());
  const [addTask, setAddTask] = useState(null);
  const [addFee, setAddFee]   = useState(null);
  const [addCase, setAddCase] = useState(false);
  const [toast, setToast]     = useState(null);
  const [loading, setLoading] = useState(true);
  const [authUser,setAuthUser]=useState(null), [authReady,setAuthReady]=useState(false), [authEmail,setAuthEmail]=useState("pnehra412@gmail.com"), [authPassword,setAuthPassword]=useState(""), [authBusy,setAuthBusy]=useState(false), [authError,setAuthError]=useState("");

  const notify = (msg, color="var(--teal)") => { setToast({msg,color}); setTimeout(()=>setToast(null),2800); };

  const loadAll = async () => {
    setLoading(true);
    try {
      const [c,t,f,h,r] = await Promise.all([
        // Cases are loaded through a server-side PostgREST filter so Decided
        // matters are never downloaded into the app at all.
        (async()=>{
          const qs="select=*&case_status=eq.Pending&order=date_next_list.asc";
          const r=await fetch(SB_URL+"/rest/v1/cases?"+qs,{
            headers:{apikey:SB_KEY,Authorization:"Bearer "+((await authClient.auth.getSession()).data.session.access_token),Accept:"application/json"}
          });
          const j=await r.json();
          if(!r.ok) throw new Error(j?.message||"Could not load active cases");
          return Array.isArray(j)?j:[];
        })(),
        sb.from("tasks").select("*"),
        sb.from("fees").select("*"),
        sb.from("hearing_history").select("*"),
        sb.from("hearing_reminders").select("*"),
      ]);
      if(Array.isArray(c) && c.length > 0) {
        setCases(c);
        notify(`✅ ${c.length} pending cases loaded`,"var(--teal)");
      } else if(Array.isArray(c) && c.length === 0) {
        notify("⚠️ No pending/active cases found","var(--amber)");
        setCases([]);
      } else {
        notify("❌ Could not read active cases — check Supabase","var(--rose)");
      }
      if(Array.isArray(t)) setTasks(t);
      if(Array.isArray(f)) setFees(f);
      if(Array.isArray(h)) setHistory(h);
      if(Array.isArray(r)) setReminders(r);
    } catch(e) {
      notify("Connection error: "+e.message,"var(--rose)");
    }
    setLoading(false);
  };

  useEffect(()=>{let active=true; authClient.auth.getSession().then(({data:{session}})=>{if(active){setAuthUser(session?session.user:null);setAuthReady(true);}}).catch(()=>{if(active)setAuthReady(true);});
   const listener=authClient.auth.onAuthStateChange((_event,session)=>{setAuthUser(session?session.user:null);setAuthReady(true);if(!session){setCases([]);setTasks([]);setFees([]);setHistory([]);setReminders([]);}});
   return ()=>{active=false;listener.data.subscription.unsubscribe();};},[]);
  useEffect(()=>{if(authUser)loadAll();},[authUser&&authUser.id]);
  const signIn=async e=>{e.preventDefault();setAuthBusy(true);setAuthError("");const r=await authClient.auth.signInWithPassword({email:authEmail.trim(),password:authPassword});setAuthBusy(false);if(r.error)setAuthError(r.error.message);else setAuthPassword("");};
  const signOut=async()=>{await authClient.auth.signOut();setAuthUser(null);};
  const notionSync=async(action)=>{if(action==="sync"&&!window.confirm("Update matched Notion case rows from Supabase? Notion-only fields will be preserved."))return;try{const q=await authClient.auth.getSession();const session=q.data&&q.data.session;if(!session||!session.access_token)throw new Error("Please sign in again.");const response=await fetch(SB_URL+"/functions/v1/mercury-notion-sync",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},body:JSON.stringify({action:action})});const data=await response.json();if(!response.ok)throw new Error(data.error||data.message||("HTTP "+response.status));if(action==="preview")notify("Preview: "+data.supabase_pending_cases_read+" pending cases; "+data.existing_cino_matches+" CINO matches; "+data.pending_cases_not_in_notion+" unmatched.","var(--teal)");else notify("Notion sync: "+data.updated_pages+" rows updated; "+data.pending_cases_not_in_notion+" unmatched. No pages created/deleted.","var(--teal)");}catch(e){notify("Notion "+action+" failed: "+e.message,"var(--rose)");}};

  const logActivity=async(cino,action,summary,details={})=>{if(!authUser?.id)return;try{await sb.from("case_activity").insert({user_id:authUser.id,cino:cino||null,entity_type:cino?"case":"workspace",action,summary,details});}catch(e){console.warn("activity log",e);}};

  // Browser notifications repeat every 30 minutes while Mercury is open.
  // Task reminders are individual; hearing reminders are batched once per local day.
  useEffect(() => {
    const checkDueItems = () => {
      if (!("Notification" in window) || Notification.permission !== "granted") return;
      tasks.filter(t => !t.done && t.due && t.due <= TODAY).forEach(t => {
        const key = "mercury-reminder-task-" + (t.id || t.title) + "-" + TODAY;
        try {
          if (localStorage.getItem(key)) return;
          new Notification("Mercury task due", {body:(t.title || "Untitled task") + " · " + t.due});
          localStorage.setItem(key,"1");
        } catch(e) {}
      });
      const upcoming = cases
        .filter(c => {
          const d = daysUntil(c.date_next_list);
          return Number.isFinite(d) && d >= 0 && d <= 3;
        })
        .sort((a,b) => String(a.date_next_list).localeCompare(String(b.date_next_list)));
      const hearingKey = "mercury-reminder-hearings-" + TODAY;
      try {
        if (upcoming.length && !localStorage.getItem(hearingKey)) {
          const todayCount = upcoming.filter(c => daysUntil(c.date_next_list) === 0).length;
          const tomorrowCount = upcoming.filter(c => daysUntil(c.date_next_list) === 1).length;
          const details = [];
          if (todayCount) details.push(todayCount + " today");
          if (tomorrowCount) details.push(tomorrowCount + " tomorrow");
          const laterCount = upcoming.length - todayCount - tomorrowCount;
          if (laterCount) details.push(laterCount + " in 2–3 days");
          // Keep client and case names out of operating-system notifications for confidentiality.
          new Notification("Mercury cause-list reminder", {
            body: upcoming.length + " hearing(s) coming up: " + details.join(", ") + ". Open Mercury to review the cause list.",
            tag: "mercury-hearings-" + TODAY
          });
          localStorage.setItem(hearingKey,"1");
        }
      } catch(e) {}
    };
    checkDueItems();
    const timer=setInterval(checkDueItems, 30*60*1000);
    return () => clearInterval(timer);
  }, [tasks, cases]);

  const allDists  = useMemo(() => [...new Set(cases.map(c=>c.district_name))].sort(), [cases]);
  const allTypes  = useMemo(() => [...new Set(cases.map(c=>c.type_name))].sort(), [cases]);
  const todayCases = useMemo(() => cases.filter(c=>daysUntil(c.date_next_list)===0), [cases]);
  const next7      = useMemo(() => cases.filter(c=>{const d=daysUntil(c.date_next_list);return d>=0&&d<=7;}), [cases]);
  const overdue    = useMemo(() => cases.filter(c=>c.date_next_list && daysUntil(c.date_next_list)<0), [cases]);
  const missingDate = useMemo(() => cases.filter(c=>!c.date_next_list), [cases]);
  const pendTasks  = useMemo(() => tasks.filter(t=>!t.done), [tasks]);

  const filtered = useMemo(() => {
    let out = [...cases];
    if(searchQ){const q=searchQ.trim().toLowerCase();if(q)out=out.filter(c=>[c.cino,c.petparty_name,c.resparty_name,c.note,c.notes_adv,c.purpose_name,c.type_name,c.court_no_desg_name,c.district_name,c.establishment_name].some(v=>String(v??"").toLowerCase().includes(q)));}
    if(fDist!=="All") out=out.filter(c=>c.district_name===fDist);
    if(fType!=="All") out=out.filter(c=>c.type_name===fType);
    if(sortBy==="date") out.sort((a,b)=>new Date(a.date_next_list)-new Date(b.date_next_list));
    if(sortBy==="type") out.sort((a,b)=>a.type_name.localeCompare(b.type_name));
    return out;
  }, [cases,searchQ,fDist,fType,sortBy]);

  const openCase = c => { setDetail(c); setView("cases"); };

  const NAV = [
    {id:"dashboard",icon:"home",  label:"Dashboard"},
    {id:"office",icon:"search",label:"Case Intelligence"},
    {id:"cases",    icon:"list",  label:"Cases"},
    {id:"calendar", icon:"cal",   label:"Cause List"},
    {id:"diary",    icon:"history",label:"Case Diary"},
    {id:"tasks",    icon:"task",  label:"Tasks"},
    {id:"fees",     icon:"fee",   label:"Fee Ledger"},
    {id:"analytics",icon:"bar",   label:"Analytics"},
  ];

  // ── DASHBOARD ────────────────────────────────────────────────────────────
  const Dashboard = () => {
    const totalFees  = fees.reduce((s,f)=>s+(parseFloat(f.amount_paid)||0),0);
    const pendingFee = fees.reduce((s,f)=>s+(parseFloat(f.amount_agreed)||0)-(parseFloat(f.amount_paid)||0),0);
    const byDist = allDists.map(d=>({d,n:cases.filter(c=>c.district_name===d).length}));
    return (
      <div className="fade-up mercury-dashboard" style={{display:"flex",flexDirection:"column",gap:14}}>
        <section className="mercury-welcome">
          <div className="mercury-welcome-copy">
            <div className="mercury-eyebrow"><span className="mercury-live-dot"/> MERCURY PCMS <span className="mercury-eyebrow-divider">/</span> CHAMBER OVERVIEW</div>
            <h1>Good day, Advocate.</h1>
            <p>Your practice at a glance. Keep hearings, files and follow-ups moving.</p>
            <div className="mercury-welcome-date"><Ic n="cal" size={14}/>{new Date().toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
          </div>
          <div className="mercury-welcome-mark" aria-hidden="true"><div className="mercury-mark-ring"><Ic n="scale" size={38}/></div><span>CASE MANAGEMENT</span><strong>Organised. Prepared. On record.</strong></div>
        </section>
        <section className="mercury-quick-actions" aria-label="Quick actions">
          <button className="mercury-action-primary" onClick={()=>{setView("cases");setAddCase(true);}}><span className="mercury-action-icon"><Ic n="plus" size={17}/></span><span><strong>Add a case</strong><small>Register a new matter</small></span><Ic n="chevron-right" size={16}/></button>
          <button onClick={()=>setView("calendar")}><span className="mercury-action-icon"><Ic n="cal" size={17}/></span><span><strong>Cause list</strong><small>Upcoming hearings</small></span><Ic n="chevron-right" size={16}/></button>
          <button onClick={()=>setView("diary")}><span className="mercury-action-icon"><Ic n="history" size={17}/></span><span><strong>Case diary</strong><small>Proceedings & next dates</small></span><Ic n="chevron-right" size={16}/></button>
          <button onClick={()=>setAddTask("__free__")}><span className="mercury-action-icon"><Ic n="task" size={17}/></span><span><strong>New task</strong><small>Record a follow-up</small></span><Ic n="chevron-right" size={16}/></button>
          <button onClick={()=>setView("office")}><span className="mercury-action-icon"><Ic n="search" size={17}/></span><span><strong>Case intelligence</strong><small>Search orders & proceedings</small></span><Ic n="chevron-right" size={16}/></button>
        </section>
        {/* Status */}
        <div style={{display:"flex",alignItems:"center",gap:10,background:"var(--white)",borderRadius:8,padding:"8px 14px",border:"1px solid var(--border)"}}>
          <div style={{width:8,height:8,borderRadius:"50%",background:loading?"#f59e0b":cases.length>0?"#22c55e":"#ef4444",flexShrink:0}}/>
          <span style={{fontSize:11.5,color:"var(--ink3)",fontWeight:500}}>
            {loading ? "⏳ Loading from Supabase…" : cases.length>0 ? `✅ ${cases.length} cases loaded from cloud` : "⚠️ No cases found"}
          </span>
          <Btn sm v="ghost" onClick={()=>notionSync("preview")}><Ic n="search" size={12}/>Notion preview</Btn>
          <Btn sm onClick={()=>notionSync("sync")}><Ic n="sync" size={12}/>Sync Notion</Btn>
          <Btn sm v="ghost" onClick={loadAll} style={{marginLeft:"auto"}}><Ic n="sync" size={12}/>Refresh</Btn>
        </div>

        {/* Stat cards */}
        <div className="mercury-stat-grid" style={{display:"grid",gridTemplateColumns:"repeat(7,minmax(0,1fr))",gap:10}}>
          {[
            {label:"Total Cases",    val:cases.length,         icon:"list",  color:"var(--gold)",  action:()=>setView("cases")},
            {label:"Next 7 Days",    val:next7.length,         icon:"bell",  color:"var(--amber)", action:()=>setView("calendar")},
            {label:"Today",          val:todayCases.length,    icon:"alert", color:"var(--rose)",  action:()=>setView("calendar")},
            {label:"Overdue",        val:overdue.length,        icon:"alert", color:"#c0392b", action:()=>setView("calendar")},
            {label:"No Next Date",   val:missingDate.length,    icon:"cal", color:"#7a5b9e", action:()=>setView("cases")},
            {label:"Pending Tasks",  val:pendTasks.length,     icon:"task",  color:"var(--teal)",  action:()=>setView("tasks")},
            {label:"Fees Received",  val:`₹${(totalFees/1000).toFixed(0)}k`,icon:"fee",color:"#1a6aa8",action:()=>setView("fees")},
          ].map((s,i) => (
            <div key={i} onClick={s.action} style={{background:"var(--white)",borderRadius:10,border:"1px solid var(--border)",boxShadow:"var(--shadow)",padding:"13px 14px",cursor:"pointer",transition:"all 0.15s",animation:`fadeUp 0.28s ease ${i*0.05}s both`}}
              onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 4px 20px rgba(0,0,0,0.12)";e.currentTarget.style.transform="translateY(-2px)";}}
              onMouseLeave={e=>{e.currentTarget.style.boxShadow="var(--shadow)";e.currentTarget.style.transform="";}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
                <div style={{background:s.color+"18",borderRadius:6,padding:6}}><Ic n={s.icon} color={s.color} size={15}/></div>
                <span style={{fontSize:22,fontWeight:900,fontFamily:"'Playfair Display',serif",color:s.color}}>{s.val}</span>
              </div>
              <div style={{fontSize:10.5,color:"var(--silver)",fontWeight:500}}>{s.label}</div>
            </div>
          ))}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1.5fr 1fr",gap:10}}>
          {/* Upcoming */}
          <Card p={0} style={{overflow:"hidden"}}>
            <div style={{padding:"10px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:7}}>
              <Ic n="bell" size={13} color="var(--amber)"/>
              <span style={{fontWeight:600,fontSize:12.5}}>Next 7 Days ({next7.length})</span>
              <Btn sm v="ghost" style={{marginLeft:"auto"}} onClick={()=>setView("calendar")}><Ic n="cal" size={11}/>Calendar</Btn>
            </div>
            <div style={{maxHeight:210,overflowY:"auto"}}>
              {next7.length===0&&<div style={{padding:20,textAlign:"center",color:"var(--silver)",fontSize:12}}>None upcoming</div>}
              {[...next7].sort((a,b)=>new Date(a.date_next_list)-new Date(b.date_next_list)).map(c=>{
                const days=daysUntil(c.date_next_list);const urg=urgency(days);const t=tm(c.type_name);
                return <div key={c.cino} style={{padding:"9px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
                  onClick={()=>openCase(c)} onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                  <div style={{minWidth:36,textAlign:"center",background:urg.bg,borderRadius:5,padding:"3px 0",fontSize:11,fontWeight:700,color:urg.color}}>{urg.label}</div>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:12,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div>
                    <div style={{fontSize:10,color:"var(--silver)",marginTop:1}}>{fmtShort(c.date_next_list)} · {c.court_no_desg_name}</div>
                  </div>
                  <Bdg label={t.label} color={t.color}/>
                </div>;
              })}
            </div>
          </Card>

          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {/* Today */}
            <Card p={0} style={{overflow:"hidden"}}>
              <div style={{padding:"9px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:7}}>
                <Ic n="alert" size={13} color="var(--rose)"/>
                <span style={{fontWeight:600,fontSize:12.5,color:"var(--rose)"}}>Today</span>
              </div>
              {todayCases.length===0
                ?<div style={{padding:"10px 14px",fontSize:12,color:"var(--silver)"}}>No hearings today</div>
                :todayCases.map(c=><div key={c.cino} style={{padding:"8px 14px",borderBottom:"1px solid var(--border)",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}}
                    onClick={()=>openCase(c)} onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div>
                      <div style={{fontSize:10,color:"var(--silver)"}}>{c.purpose_name}</div>
                    </div>
                    <Bdg label={tm(c.type_name).label} color={tm(c.type_name).color}/>
                  </div>)
              }
            </Card>

            {/* District */}
            <Card p={12}>
              <div style={{fontWeight:600,fontSize:12,marginBottom:10}}>By District</div>
              {byDist.map(({d,n})=>(
                <div key={d} style={{marginBottom:7,cursor:"pointer"}} onClick={()=>{setFDist(d);setView("cases");}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:11.5,marginBottom:2}}><span>{d}</span><span style={{fontWeight:700}}>{n}</span></div>
                  <div style={{background:"var(--paper)",borderRadius:3,height:4}}><div style={{height:"100%",background:"var(--gold)",borderRadius:3,width:`${(n/cases.length)*100}%`}}/></div>
                </div>
              ))}
            </Card>
          </div>
        </div>

        {/* Fee summary */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10}}>
          {[["Total Agreed","var(--ink3)",fees.reduce((s,f)=>s+(parseFloat(f.amount_agreed)||0),0)],["Received","var(--teal)",totalFees],["Pending","var(--rose)",Math.max(0,pendingFee)]].map(([l,c,v])=>(
            <Card key={l} p={12} style={{cursor:"pointer"}} onClick={()=>setView("fees")}>
              <div style={{fontSize:10.5,color:"var(--silver)",marginBottom:5}}>{l}</div>
              <div style={{fontSize:18,fontWeight:900,fontFamily:"'Playfair Display',serif",color:c}}>₹{v.toLocaleString("en-IN")}</div>
            </Card>
          ))}
        </div>

        {overdue.length>0&&(
          <div style={{background:"#fff5f5",border:"1px solid rgba(192,57,43,0.25)",borderRadius:8,padding:"10px 14px",display:"flex",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>setView("cases")}>
            <Ic n="alert" size={14} color="var(--rose)"/>
            <span style={{fontSize:12.5,color:"var(--rose)",fontWeight:600}}>{overdue.length} past-date hearing{overdue.length>1?"s":""} — please update next dates</span>
            <Btn sm v="rose" style={{marginLeft:"auto"}}>View</Btn>
          </div>
        )}
      </div>
    );
  };

  // ── CASES ────────────────────────────────────────────────────────────────
  const CasesView = () => (
    <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10,height:"100%"}}>
      <div style={{display:"flex",alignItems:"center",gap:10}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Case Registry <span style={{fontSize:12,fontWeight:400,color:"var(--silver)"}}>{filtered.length}/{cases.length}</span></h2>
        <div style={{marginLeft:"auto",display:"flex",gap:7,flexWrap:"wrap"}}><Btn sm v="ghost" onClick={()=>{const rows=filtered.map(c=>({"CNR":c.cino||"","Case":partyLabel(c),"Court":c.court_no_desg_name||"","District":c.district_name||"","Case Type":c.type_name||"","Status":c.case_status||"","Next Hearing":c.date_next_list||"","Purpose":c.purpose_name||"","Notes":c.notes_adv||c.note||""}));if(!downloadCsv("mercury-case-registry.csv",rows))notify("No cases to export","var(--amber)");}}><Ic n="save" size={12}/>Export CSV / Excel</Btn><Btn onClick={()=>setAddCase(true)}><Ic n="plus" size={13}/>Add Case</Btn></div>
      </div>
      <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",background:"var(--white)",borderRadius:8,padding:"8px 12px",border:"1px solid var(--border)"}}>
        <Ic n="filter" size={13} color="var(--silver)"/>
        {[[fDist,setFDist,"All Districts",allDists],[fType,setFType,"All Types",allTypes]].map(([val,set,ph,opts],i)=>(
          <select key={i} value={val} onChange={e=>set(e.target.value)} style={{...iS,width:"auto",padding:"4px 8px",fontSize:11.5}}>
            <option value="All">{ph}</option>
            {opts.map(o=><option key={o}>{o}</option>)}
          </select>
        ))}
        <select value={sortBy} onChange={e=>setSortBy(e.target.value)} style={{...iS,width:"auto",padding:"4px 8px",fontSize:11.5}}>
          <option value="date">Sort: Date</option>
          <option value="type">Sort: Type</option>
        </select>
        {(fDist!=="All"||fType!=="All")&&<Btn sm v="ghost" onClick={()=>{setFDist("All");setFType("All");}}>Clear</Btn>}
      </div>
      <div style={{flex:1,overflow:"hidden",background:"var(--white)",borderRadius:10,border:"1px solid var(--border)",boxShadow:"var(--shadow)",display:"flex",flexDirection:"column"}}>
        <div style={{display:"grid",gridTemplateColumns:"155px 1fr 145px 110px 68px 54px",padding:"8px 14px",background:"var(--paper)",borderBottom:"1px solid var(--border)",fontSize:9.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase",letterSpacing:"0.08em",gap:8,flexShrink:0}}>
          {["CNR / Type","Parties","Court","Purpose","Date","Days"].map(h=><div key={h}>{h}</div>)}
        </div>
        <div style={{flex:1,overflowY:"auto"}}>

              onClick={()=>setDetail(c)} onMouseEnter={e=>!sel&&(e.currentTarget.style.background="var(--paper)")} onMouseLeave={e=>!sel&&(e.currentTarget.style.background="")}>
              <div><div className="mono" style={{fontSize:9,color:"var(--silver)",marginBottom:3}}>{c.cino}</div><Bdg label={t.label} color={t.color}/></div>
              <div>
                <div style={{fontSize:12,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div>
                {c.note&&<div style={{fontSize:9.5,color:"var(--gold)",marginTop:1}}>★ {c.note}</div>}
              </div>
              <div><div style={{fontSize:11,color:"var(--ink3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.court_no_desg_name}</div><div style={{fontSize:10,color:"var(--silver)",marginTop:1}}>{c.district_name}</div></div>
              <Bdg label={c.purpose_name} color={pcColor(c.purpose_name)}/>
              <div style={{fontSize:11,color:"var(--ink3)"}}>{fmtShort(c.date_next_list)}</div>
              <span style={{fontSize:10.5,fontWeight:700,color:urg.color,background:urg.bg,borderRadius:4,padding:"2px 5px",whiteSpace:"nowrap"}}>{urg.label}</span>
            </div>;
          })}
        </div>
      </div>
      {detail&&<DetailPanel c={detail} onClose={()=>setDetail(null)}/>}
    </div>
  );

  // ── DETAIL PANEL ─────────────────────────────────────────────────────────
  const DetailPanel = ({c,onClose}) => {
    const t=tm(c.type_name);
    const days=daysUntil(c.date_next_list);
    const urg=urgency(days);
    const caseTasks=tasks.filter(x=>x.cino===c.cino);
    const caseHistory=history.filter(x=>x.cino===c.cino).sort((a,b)=>new Date(b.hearing_date)-new Date(a.hearing_date));
    const [noteVal,setNoteVal]=useState(c.notes_adv||"");
    const [activeTab,setActiveTab]=useState("info");
    const [saving,setSaving]=useState(false);
    const [editingParty,setEditingParty]=useState(false);
    const [partyForm,setPartyForm]=useState({petparty_name:c.petparty_name||"",resparty_name:c.resparty_name||""});
    const [newDate,setNewDate]=useState(c.date_next_list||"");
    const [reminderAt,setReminderAt]=useState("");
    const [reminderSaving,setReminderSaving]=useState(false);
    const saveHearingReminder=async()=>{if(!reminderAt){notify("Choose a reminder date and time","var(--amber)");return;}setReminderSaving(true);try{const when=new Date(reminderAt);if(Number.isNaN(when.getTime())||when.getTime()<=Date.now())throw new Error("Choose a future date and time.");const res=await sb.from("hearing_reminders").insert({user_id:authUser.id,case_id:c.id,reminder_at:when.toISOString(),channel:"in_app",status:"pending",next_attempt_at:when.toISOString()});if(Array.isArray(res)&&res.length){setReminders(list=>[...list,...res]);setReminderAt("");notify("Reminder saved to Supabase","var(--teal)");}else notify("Reminder was not saved","var(--rose)");}catch(e){notify("Reminder failed: "+e.message,"var(--rose)");}setReminderSaving(false);};
    const [histForm,setHistForm]=useState({hearing_date:"",purpose:"",outcome:"",next_date:"",notes:""});

    const [chatLinks, setChatLinks] = useState([]);
    const [chatLinksLoading, setChatLinksLoading] = useState(false);
    const [chatProvider, setChatProvider] = useState("ChatGPT");
    const [chatUrl, setChatUrl] = useState("");
    const [chatSaving, setChatSaving] = useState(false);

    const loadChatLinks = async () => {
      setChatLinksLoading(true);
      try {
        const sessionResult=await authClient.auth.getSession(); const session=sessionResult.data&&sessionResult.data.session; if(!session||!session.access_token)throw new Error("Please sign in again.");
        const r = await fetch("https://hmtcnatqowokeyrdjujq.supabase.co/functions/v1/case-ai-chats?cino="+encodeURIComponent(c.cino),{headers:{apikey:SB_KEY,Authorization:"Bearer "+session.access_token}});
        const j = await r.json();
        if(r.ok && Array.isArray(j.chats)) setChatLinks(j.chats);
      } catch(e) { console.error("loadChatLinks",e); }
      setChatLinksLoading(false);
    };

    useEffect(() => {
      if(activeTab==="ai") loadChatLinks();
    }, [activeTab,c.cino]);

    const copyCaseDraftingBrief = () => {
      const recentHistory = caseHistory.slice(0,12).map((h,i)=>[
        (i+1)+". Hearing date: "+(h.hearing_date||"Not recorded"),
        "Purpose: "+(h.purpose||"Not recorded"),
        "Proceedings/outcome: "+(h.outcome||"Not recorded"),
        "Next date: "+(h.next_date||"Not recorded"),
        "Notes: "+(h.notes||"None")
      ].join("\n")).join("\n\n");
      const documentList = caseDocs.map((d,i)=>((i+1)+". "+(d.name||"Unnamed document")+" | Type: "+(d.doc_type||d.document_category||"Unclassified")+" | Order date: "+(d.order_date||"Not recorded")+" | Analysis: "+(d.ai_summary||"No AI summary available")+" | Advocate action: "+(d.latest_order_action||"Not recorded"))).join("\n");
      const brief = [
        "LEGAL DRAFTING BRIEF — MERCURY PCMS",
        "Prepare work only from the facts and source documents supplied. Do not invent facts, dates, pleadings, citations, statutory provisions, or case law. Separate established record facts from client assertions and assumptions. Flag missing or inconsistent material and verify authorities before relying on them.",
        "",
        "CASE IDENTIFICATION",
        "CNR: "+(c.cino||"Not recorded"),
        "Case type: "+(c.type_name||"Not recorded"),
        "Petitioner/plaintiff/applicant: "+(c.petparty_name||"Not recorded"),
        "Respondent/defendant: "+(c.resparty_name||"Not recorded"),
        "Court: "+(c.court_no_desg_name||"Not recorded"),
        "District: "+(c.district_name||"Not recorded"),
        "Next hearing: "+(c.date_next_list||"Not recorded"),
        "Purpose: "+(c.purpose_name||"Not recorded"),
        "Latest order date: "+(c.latest_order_date||"Not recorded"),
        "Latest order summary: "+(c.latest_order_crux||"Not recorded"),
        "Court-directed/advocate action: "+(c.latest_order_action||"Not recorded"),
        "Status: "+(c.case_status||"Not recorded"),
        "",
        "CHAMBER NOTES",
        c.notes_adv||c.note||"No chamber note recorded.",
        "",
        "RECORDED HEARING HISTORY (newest first)",
        recentHistory||"No hearing history recorded in Mercury.",
        "",
        "DOCUMENTS LISTED IN MERCURY (filenames only; contents are not included in this brief)",
        documentList||"No case documents are listed.",
        "",
        "TASK",
        "First summarise the material facts, procedural history, next steps and missing information. Then prepare the requested legal draft in Indian legal drafting style. Use paragraph numbering and begin each substantive paragraph with 'That' where appropriate. Do not represent this brief alone as a substitute for reviewing the original documents. Ask for the specific draft type if it has not been stated."
      ].join("\n");
      try {
        const el=document.createElement("textarea");
        el.value=brief;el.style.cssText="position:fixed;top:0;left:0;opacity:0;";
        document.body.appendChild(el);el.focus();el.select();
        const ok=document.execCommand("copy");document.body.removeChild(el);
        if(ok) notify("Case drafting brief copied. Review it and attach source documents before drafting.","var(--teal)");
        else notify("Copy was blocked by the browser. Please try again.","var(--amber)");
      } catch(e) { notify("Could not copy the case brief. Please try again.","var(--rose)"); }
    };

    const saveChatLink = async () => {
      if(!chatUrl.trim() || chatSaving) return;
      setChatSaving(true);
      try {
        const sessionResult=await authClient.auth.getSession(); const session=sessionResult.data&&sessionResult.data.session; if(!session||!session.access_token)throw new Error("Please sign in again.");
        const r = await fetch("https://hmtcnatqowokeyrdjujq.supabase.co/functions/v1/case-ai-chats", {
          method:"POST",
          headers:{apikey:SB_KEY,Authorization:"Bearer "+session.access_token,"Content-Type":"application/json"},
          body:JSON.stringify({
            cino:c.cino,
            provider:chatProvider,
            title:`${chatProvider} — ${partyLabel(c)}`,
            chat_url:chatUrl.trim()
          })
        });
        const j = await r.json();
        if(!r.ok) throw new Error(j.error||"Could not save chat link");
        setChatUrl("");
        await loadChatLinks();
        notify(`✅ ${chatProvider} chat linked to this case`,"var(--teal)");
      } catch(e) {
        notify("⚠️ "+(e.message||"Could not save chat link"),"var(--rose)");
      }
      setChatSaving(false);
    };

    const saveNote=async()=>{setSaving(true);await sb.from("cases").update({notes_adv:noteVal},{cino:c.cino});setCases(cs=>cs.map(x=>x.cino===c.cino?{...x,notes_adv:noteVal}:x));setDetail(p=>({...p,notes_adv:noteVal}));await logActivity(c.cino,"advocate_notes_updated","Updated advocate notes",{});notify("✅ Notes saved");setSaving(false);};
    const saveParty=async()=>{
      const petitioner=(partyForm.petparty_name||"").trim();
      const respondent=(partyForm.resparty_name||"").trim();
      if(!petitioner){notify("⚠️ Petitioner name cannot be empty","var(--rose)");return;}
      setSaving(true);
      const res=await sb.from("cases").update({petparty_name:petitioner,resparty_name:respondent},{cino:c.cino});
      if(Array.isArray(res)&&res.length>0){
        const updated={...c,petparty_name:petitioner,resparty_name:respondent};
        setCases(cs=>cs.map(x=>x.cino===c.cino?{...x,petparty_name:petitioner,resparty_name:respondent}:x));
        setDetail(updated);
        setPartyForm({petparty_name:petitioner,resparty_name:respondent});
        await logActivity(c.cino,"parties_updated","Updated case party names",{petitioner,respondent});
        setEditingParty(false);
        notify("✅ Party names updated","var(--teal)");
      }else{
        notify("❌ Could not update party names. Please try again.","var(--rose)");
      }
      setSaving(false);
    };
    const updateDate=async()=>{if(!newDate)return;setSaving(true);await sb.from("cases").update({date_next_list:newDate},{cino:c.cino});setCases(cs=>cs.map(x=>x.cino===c.cino?{...x,date_next_list:newDate}:x));setDetail(p=>({...p,date_next_list:newDate}));await logActivity(c.cino,"next_hearing_date_updated","Updated next hearing date",{date:newDate});notify("✅ Date updated!");setSaving(false);};
    const addHistory=async()=>{
      if(!histForm.hearing_date){notify("Please enter the hearing date","var(--amber)");return;}
      setSaving(true);
      const entry={...histForm,cino:c.cino,user_id:authUser.id};
      const res=await sb.from("hearing_history").insert(entry);
      if(Array.isArray(res)&&res.length){
        setHistory(h=>[...h,...res]);
        if(histForm.next_date){
          await sb.from("cases").update({date_next_list:histForm.next_date},{cino:c.cino});
          setCases(cs=>cs.map(x=>x.cino===c.cino?{...x,date_next_list:histForm.next_date}:x));
          setDetail(p=>p&&p.cino===c.cino?({...p,date_next_list:histForm.next_date}):p);
        }
        await logActivity(c.cino,"hearing_recorded","Recorded hearing / proceedings",{hearing_date:histForm.hearing_date,next_date:histForm.next_date,purpose:histForm.purpose,outcome:histForm.outcome});
        setHistForm({hearing_date:"",purpose:"",outcome:"",next_date:"",notes:""});
        notify(histForm.next_date?"Hearing logged and next hearing date updated":"Hearing logged");
      }else{
        notify("Could not save the hearing. Please check your connection and try again.","var(--rose)");
      }
      setSaving(false);
    };

    const TABS=["info","diary","tasks","docs","notes","ai","cnr"];
    const [caseDocs,setCaseDocs]=useState([]);
    const [docSearch,setDocSearch]=useState("");
    const visibleCaseDocs=useMemo(()=>{const q=docSearch.trim().toLowerCase();return caseDocs.filter(d=>!q||(d.name||"").toLowerCase().includes(q));},[caseDocs,docSearch]);
    const [docsLoading,setDocsLoading]=useState(false);
    const [docType,setDocType]=useState("Other");
    const [orderProcessing,setOrderProcessing]=useState(false);
    const [selectedDocIds,setSelectedDocIds]=useState([]);
    const fileRef=useRef(null);

    // Load docs for this case from documents table
    useEffect(()=>{
      const load=async()=>{
        setDocsLoading(true);
        const res=await sbReq("GET",`documents?cino=eq.${encodeURIComponent(c.cino)}&select=*&order=uploaded_at.desc`);
        if(Array.isArray(res))setCaseDocs(res);
        setDocsLoading(false);
      };
      load();
    },[c.cino]);

    useEffect(()=>{ setSelectedDocIds([]); },[c.cino]);

    const toggleDoc=docId=>{
      setSelectedDocIds(ids=>ids.includes(docId)?ids.filter(x=>x!==docId):[...ids,docId]);
    };

    const selectAllDocs=()=>{
      setSelectedDocIds(visibleCaseDocs.map(d=>d.id).filter(Boolean));
    };

    const clearSelectedDocs=()=>setSelectedDocIds([]);

    const shareSelectedDocuments=async(ids=selectedDocIds)=>{
      const chosen=caseDocs.filter(d=>ids.includes(d.id));
      if(!chosen.length){notify("⚠️ Select at least one document","var(--rose)");return;}
      try{
        notify("⏳ Preparing "+chosen.length+" document"+(chosen.length>1?"s":"")+" for sharing…","var(--amber)");
        const r=await fetch("https://hmtcnatqowokeyrdjujq.supabase.co/functions/v1/prepare-document-share",{
          method:"POST",
          headers:{apikey:SB_KEY,Authorization:"Bearer "+((await authClient.auth.getSession()).data.session.access_token),"Content-Type":"application/json"},
          body:JSON.stringify({document_ids:chosen.map(d=>d.id)})
        });
        const j=await r.json();
        if(!r.ok||!Array.isArray(j.documents)) throw new Error(j.error||"Could not prepare documents");
        const ready=j.documents.filter(x=>x.url);
        if(!ready.length) throw new Error("No documents were available for sharing");
        const failed=j.documents.filter(x=>!x.url);
        if(window.MercuryAndroid&&typeof window.MercuryAndroid.shareDocuments==="function"){
          window.MercuryAndroid.shareDocuments(JSON.stringify(ready.map(x=>({url:x.url,name:x.name||"document.pdf"}))));
          if(failed.length) notify("⚠️ "+failed.length+" document(s) could not be prepared","var(--amber)");
          else notify("✓ Opening Android Share…","var(--teal)");
        }else if(navigator.share){
          const urls=ready.map(x=>x.url).join("\n");
          await navigator.share({title:"Mercury case documents",text:"Mercury case documents:\n"+urls});
        }else{
          ready.forEach(x=>window.open(x.url,"_blank","noopener,noreferrer"));
          notify("✓ Documents opened. Choose your destination from the browser.","var(--teal)");
        }
      }catch(e){
        if(e?.name==="AbortError") return;
        console.error("shareSelectedDocuments",e);
        notify("⚠️ Could not share documents: "+(e.message||"Unknown error"),"var(--rose)");
      }
    };

    const openExternal=url=>{
      if(!url) return;
      if(window.MercuryAndroid&&typeof window.MercuryAndroid.openExternal==="function"){
        window.MercuryAndroid.openExternal(url);
        return;
      }
      // Use a real user-initiated anchor click on Windows/web so popup blockers
      // do not prevent ChatGPT/Claude from opening.
      const a=document.createElement("a");
      a.href=url;
      a.target="_blank";
      a.rel="noopener noreferrer";
      a.style.display="none";
      document.body.appendChild(a);
      a.click();
      a.remove();
    };

    const fileIcon=name=>{
      const ext=(name||"").split(".").pop().toLowerCase();
      if(ext==="pdf") return "📄";
      if(["doc","docx"].includes(ext)) return "📝";
      if(["jpg","jpeg","png","gif"].includes(ext)) return "🖼️";
      return "📎";
    };

    const formatSize=bytes=>{
      if(bytes<1024) return bytes+"B";
      if(bytes<1024*1024) return (bytes/1024).toFixed(1)+"KB";
      return (bytes/(1024*1024)).toFixed(1)+"MB";
    };

    const handleUpload=async(files)=>{
      const arr=Array.from(files||[]); if(!arr.length)return;
      setSaving(true);let uploaded=0,orders=0;const failures=[];
      try{
        for(const file of arr){try{
          if(docType==="Order"){
            if(!(file.type==="application/pdf"||/\.pdf$/i.test(file.name)))throw new Error("Automatic court-order analysis requires a PDF.");
            setOrderProcessing(true);notify("Uploading and analysing "+file.name+"…","var(--amber)");
            const sr=await authClient.auth.getSession(),session=sr.data&&sr.data.session;if(!session?.access_token)throw new Error("Please sign in again.");
            const form=new FormData();form.append("file",file);form.append("doc_type","Order");
            const response=await fetch(SB_URL+"/functions/v1/capture-mobile-order",{method:"POST",headers:{apikey:SB_KEY,Authorization:"Bearer "+session.access_token},body:form});
            const data=await response.json().catch(()=>({}));if(!response.ok||!data.ok)throw new Error(data.error||"Order analysis failed");
            orders++;
            if(data.document_id){const rows=await sbReq("GET","documents?id=eq."+encodeURIComponent(data.document_id)+"&select=*");if(Array.isArray(rows)&&rows[0]&&rows[0].cino===c.cino)setCaseDocs(ds=>[rows[0],...ds.filter(d=>d.id!==rows[0].id)]);}
            await loadAll();
            if(data.cino){const updatedCase=await sbReq("GET","cases?cino=eq."+encodeURIComponent(data.cino)+"&select=*");if(Array.isArray(updatedCase)&&updatedCase[0])setDetail(updatedCase[0]);}
            if(data.cino&&data.next_date)notify("Order processed · "+data.cino+" · Next date "+data.next_date+(data.purpose?" · "+data.purpose:""),"var(--teal)");
            else if(data.cino)notify("Order analysed for "+data.cino+". Review the extracted order details.","var(--amber)");
            else notify("Order saved. Mercury could not confidently match it; no case was auto-updated.","var(--amber)");
          }else{
            const reader=new FileReader();
            await new Promise((resolve,reject)=>{reader.onerror=()=>reject(new Error("Could not read "+file.name));reader.onload=async(e)=>{try{const res=await sbReq("POST","documents",{cino:c.cino,name:file.name,size:file.size,mime_type:file.type||"application/octet-stream",file_data:e.target.result,doc_type:docType,uploaded_at:new Date().toISOString()});if(Array.isArray(res)&&res.length){setCaseDocs(d=>[res[0],...d]);uploaded++;try{await sb.from("case_activity").insert({user_id:authUser.id,cino:c.cino,entity_type:"document",entity_id:String(res[0].id),action:"document_uploaded",summary:"Uploaded "+file.name,details:{document_type:docType,size:file.size}});}catch(_){}}resolve();}catch(err){reject(err);}};reader.readAsDataURL(file);});
          }
        }catch(err){failures.push(file.name+": "+(err.message||"Failed"));}}
        const fresh=await sbReq("GET","documents?cino=eq."+encodeURIComponent(c.cino)+"&select=*&order=uploaded_at.desc");if(Array.isArray(fresh))setCaseDocs(fresh);
        if(uploaded)notify(uploaded+" file(s) uploaded","var(--teal)");
        if(orders&&!failures.length)notify(orders+" order(s) analysed; matched case records refreshed.","var(--teal)");
        if(failures.length)notify("Upload issue: "+failures.slice(0,2).join("; "),"var(--rose)");
      }catch(err){notify("Upload failed: "+(err.message||"Unknown error"),"var(--rose)");}
      finally{setSaving(false);setOrderProcessing(false);if(fileRef.current)fileRef.current.value="";}
    };

    const deleteDoc=async(id)=>{
      const doc=caseDocs.find(x=>x.id===id);
      if(!window.confirm("Delete this document from Mercury? This cannot be undone from the app."))return;
      await sbReq("DELETE",`documents?id=eq.${id}`);
      setCaseDocs(d=>d.filter(x=>x.id!==id));
      await logActivity(c.cino,"document_deleted","Deleted "+(doc?.name||"document"),{document_id:id});
      notify("File deleted","var(--rose)");
    };

    const openDoc=async doc=>{
      try{
        if(doc.file_data){
          const a=document.createElement("a");
          a.href=doc.file_data;
          a.download=doc.name||"document";
          if(window.MercuryAndroid&&typeof window.MercuryAndroid.openDocument==="function") window.MercuryAndroid.openDocument(a.href,doc.name||"document.pdf"); else { a.target="_blank"; a.rel="noopener"; a.click(); }
          return;
        }
        if(doc.storage_bucket&&doc.storage_path){
          notify("⏳ Opening document…","var(--amber)");
          const r=await fetch("https://hmtcnatqowokeyrdjujq.supabase.co/functions/v1/get-document-url",{
            method:"POST",
            headers:{apikey:SB_KEY,Authorization:"Bearer "+((await authClient.auth.getSession()).data.session.access_token),"Content-Type":"application/json"},
            body:JSON.stringify({document_id:doc.id})
          });
          const j=await r.json();
          if(!r.ok||!j.url) throw new Error(j.error||"Could not create document link");
          if(window.MercuryAndroid&&typeof window.MercuryAndroid.openDocument==="function") window.MercuryAndroid.openDocument(j.url,doc.name||"document.pdf"); else { const a=document.createElement("a"); a.href=j.url; a.target="_blank"; a.rel="noopener"; a.click(); }
          notify("✅ Document opened","var(--teal)");
          return;
        }
        notify("⚠️ This document has no accessible file path","var(--rose)");
      }catch(e){
        console.error("openDoc",e);
        notify("⚠️ Could not open document: "+(e.message||"Unknown error"),"var(--rose)");
      }
    };
    return (
      <div className="mercury-case-overlay" style={{position:"fixed",inset:0,background:"rgba(13,17,23,0.42)",zIndex:200,display:"flex",justifyContent:"flex-end"}} onClick={e=>e.target===e.currentTarget&&onClose()}>
        <div className="mercury-case-sheet" style={{width:440,height:"100vh",overflowY:"auto",background:"var(--white)",boxShadow:"-6px 0 32px rgba(0,0,0,0.18)",display:"flex",flexDirection:"column",animation:"slideIn 0.25s ease"}}>
          <div className="case-header" style={{padding:"14px 18px 10px",borderBottom:"1px solid var(--border)",flexShrink:0}}>

              <div className="case-header-title" style={{flex:1,paddingRight:10}}>
                <div style={{fontSize:9.5,color:"var(--silver)",fontWeight:700,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>{c.district_name} · {c.establishment_name.split(",")[0]}</div>
                <div style={{fontSize:15,fontWeight:700,lineHeight:1.35,fontFamily:"'Playfair Display',serif"}}>{partyLabel(c)}</div>
              </div>
              <button onClick={onClose} style={{border:"none",background:"var(--paper)",borderRadius:6,padding:6,cursor:"pointer"}}><Ic n="x" size={14}/></button>
            </div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              <Bdg label={t.label} color={t.color}/>
              <Bdg label={c.purpose_name} color={pcColor(c.purpose_name)}/>
              <Bdg label={urg.label} color={urg.color} bg={urg.bg}/>
              <Bdg label={fmt(c.date_next_list)} color="var(--silver)"/>
            </div>

                {/* Feature 2 & 5 — eCourtsindia.com working links */}
                <div style={{background:"#f0fff4",border:"1px solid #86efac",borderRadius:9,padding:"12px 14px"}}>

                  {[
                    {label:"🔍 Search on eCourtsindia.com", sub:"Third-party portal — works without login", url:`https://ecourtsindia.com/search?q=${c.cino}`, color:"#166534", bg:"#dcfce7"},
                    {label:"📋 Case Status — eCourts Portal", sub:"services.ecourts.gov.in → CNR Search", url:`https://services.ecourts.gov.in/ecourtindiaR/`, color:"#1a3a6a", bg:"#eef4ff"},
                    {label:"⚖️ HC Punjab & Haryana", sub:"hcpbgh.nic.in → Case Status", url:`https://hcpbgh.nic.in/`, color:"#5c2090", bg:"#f5f0ff"},
                    {label:"📍 Haryana District Courts", sub:"districts.ecourts.gov.in/haryana", url:`https://districts.ecourts.gov.in/haryana`, color:"#c47a1a", bg:"#fff7ed"},
                  ].map(({label,sub,url,color,bg})=>(
                    <div key={label} style={{display:"flex",alignItems:"center",gap:10,background:bg,borderRadius:7,padding:"9px 11px",marginBottom:7,cursor:"pointer",border:`1px solid ${color}20`}}
                      onClick={()=>window.open(url,"_blank","noopener,noreferrer")}>
                      <div style={{flex:1}}>
                        <div style={{fontSize:12,fontWeight:600,color}}>{label}</div>
                        <div style={{fontSize:10,color:"#666",marginTop:2}}>{sub}</div>
                      </div>
                      <span style={{fontSize:13,color}}>→</span>
                    </div>
                  ))}
                  <div style={{fontSize:10.5,color:"#166534",background:"white",borderRadius:6,padding:"7px 10px",border:"1px solid #86efac",marginTop:4}}>
                    💡 <b>eCourtsindia.com</b> link opens directly to your CNR — no copy-paste needed
                  </div>
                </div>

                {/* Feature 1 — Today's Cause List for this court */}
                <div style={{background:"var(--paper)",border:"1px solid var(--border)",borderRadius:9,padding:"12px 14px"}}>
                  <div style={{fontSize:12,fontWeight:700,color:"var(--ink3)",marginBottom:8}}>📅 Today's Cause List — {c.establishment_name}</div>
                  <div style={{fontSize:11.5,color:"var(--silver)",marginBottom:10,lineHeight:1.6}}>
                    Check today's board for {c.court_no_desg_name}
                  </div>
                  <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                    <Btn sm v="teal" onClick={()=>window.open(`https://ecourtsindia.com/search?q=${encodeURIComponent(c.establishment_name)}&type=causelist`,"_blank","noopener,noreferrer")}>
                      📋 Today's Board
                    </Btn>
                    <Btn sm v="ghost" onClick={()=>window.open(`https://districts.ecourts.gov.in/haryana`,"_blank","noopener,noreferrer")}>
                      🏛️ District Portal
                    </Btn>
                  </div>
                </div>

                {/* Step-by-step fallback */}
                <div style={{background:"#eef4ff",border:"1px solid #c5d8f5",borderRadius:8,padding:"11px 13px"}}>
                  <div style={{fontSize:11.5,fontWeight:700,color:"#1a3a6a",marginBottom:8}}>If links don't open directly:</div>
                  {[["1","Copy CNR above"],["2","Open browser → type:","services.ecourts.gov.in"],["3","Click CNR Search → paste → Submit"]].map(([n,text,url])=>(
                    <div key={n} style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:7}}>
                      <span style={{background:"#1a3a6a",color:"white",borderRadius:"50%",width:18,height:18,fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:1}}>{n}</span>
                      <div><span style={{fontSize:11.5,color:"#1a3a6a"}}>{text}</span>{url&&<div className="mono" style={{fontSize:12,fontWeight:700,color:"#1a6aa8",background:"white",borderRadius:4,padding:"2px 7px",marginTop:3,border:"1px solid #c5d8f5",display:"inline-block"}}>{url}</div>}</div>

                  ))}

        </div>
      </div>
    );
  };

  // ── CALENDAR ─────────────────────────────────────────────────────────────
  // ── CASE DIARY ───────────────────────────────────────────────────────────
  const DiaryView = () => {
    const [diarySearch,setDiarySearch]=useState("");
    const [fromDate,setFromDate]=useState("");
    const [toDate,setToDate]=useState("");
    const rows=useMemo(()=>{
      const q=diarySearch.trim().toLowerCase();
      return [...history].filter(h=>{
        const c=cases.find(x=>x.cino===h.cino);
        const hay=[h.cino,h.purpose,h.outcome,h.notes,c&&c.petparty_name,c&&c.resparty_name,c&&c.note].filter(Boolean).join(" ").toLowerCase();
        const d=h.hearing_date||"";
        return (!q||hay.includes(q))&&(!fromDate||d>=fromDate)&&(!toDate||d<=toDate);
      }).sort((a,b)=>(b.hearing_date||"").localeCompare(a.hearing_date||""));
    },[history,cases,diarySearch,fromDate,toDate]);
    const exportRows=rows.map(h=>{
      const c=cases.find(x=>x.cino===h.cino);
      return {"Hearing Date":h.hearing_date||"","CNR":h.cino||"","Case":c?partyLabel(c):"","Court":(c&&c.court_no_desg_name)||"","Purpose":h.purpose||"","Proceedings / Outcome":h.outcome||"","Next Date":h.next_date||"","Notes":h.notes||""};
    });
    return (
      <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10,height:"100%",minHeight:0}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <div style={{minWidth:180}}>
            <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:700}}>Case Diary</h2>
            <div style={{fontSize:11,color:"var(--silver)",marginTop:2}}>Hearing history and proceedings · {rows.length} entries</div>
          </div>
          <div style={{marginLeft:"auto",display:"flex",gap:7,flexWrap:"wrap"}}>
            <Btn sm v="ghost" onClick={()=>{if(!downloadCsv("mercury-case-diary.csv",exportRows))notify("No diary entries to export","var(--amber)");}}><Ic n="save" size={12}/>Export CSV / Excel</Btn>
            <Btn sm v="ghost" onClick={()=>window.print()}><Ic n="history" size={12}/>Print / Save PDF</Btn>
            <Btn sm onClick={()=>setView("cases")}><Ic n="search" size={12}/>Find Case</Btn>
          </div>
        </div>
        <Card p={10}>
          <div style={{display:"grid",gridTemplateColumns:"minmax(180px,2fr) repeat(2,minmax(130px,1fr)) auto",gap:8,alignItems:"end"}}>
            <div><Lbl c="Search diary"/><input value={diarySearch} onChange={e=>setDiarySearch(e.target.value)} placeholder="Party, CNR, proceedings…" style={iS}/></div>
            <div><Lbl c="From date"/><input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)} style={iS}/></div>
            <div><Lbl c="To date"/><input type="date" value={toDate} onChange={e=>setToDate(e.target.value)} style={iS}/></div>
            <Btn sm v="ghost" onClick={()=>{setDiarySearch("");setFromDate("");setToDate("");}}>Clear filters</Btn>
          </div>
        </Card>
        <div style={{flex:1,minHeight:0,overflowY:"auto",background:"var(--white)",border:"1px solid var(--border)",borderRadius:10,boxShadow:"var(--shadow)"}}>
          {rows.length===0?<div style={{padding:32,textAlign:"center",color:"var(--silver)",fontSize:12}}>No diary entries match these filters. Open a case and add a hearing entry to begin.</div>:rows.map((h,i)=>{
            const c=cases.find(x=>x.cino===h.cino);
            return <div key={h.id||h.cino+"-"+h.hearing_date+"-"+i} style={{padding:"12px 14px",borderBottom:"1px solid var(--border)",display:"grid",gridTemplateColumns:"100px minmax(0,1fr) auto",gap:12,alignItems:"start",cursor:c?"pointer":"default"}} onClick={()=>c&&openCase(c)} onMouseEnter={e=>{if(c)e.currentTarget.style.background="var(--paper)"}} onMouseLeave={e=>e.currentTarget.style.background="white"}>
              <div style={{fontSize:11.5,fontWeight:700,color:"var(--ink3)"}}>{fmt(h.hearing_date)}</div>
              <div style={{minWidth:0}}>
                <div style={{fontSize:12.5,fontWeight:700,marginBottom:4,overflowWrap:"anywhere"}}>{c?partyLabel(c):(h.cino||"Unlinked diary entry")}</div>
                <div style={{fontSize:10.5,color:"var(--silver)",marginBottom:5}}>{h.cino||"No CNR"}{c&&c.court_no_desg_name?" · "+c.court_no_desg_name:""}</div>
                {h.purpose&&<div style={{fontSize:11.5,fontWeight:600,color:pcColor(h.purpose),marginBottom:3}}>{h.purpose}</div>}
                {h.outcome&&<div style={{fontSize:12,color:"var(--ink3)",whiteSpace:"pre-wrap"}}>{h.outcome}</div>}
                {h.notes&&<div style={{fontSize:11,color:"var(--silver)",marginTop:4,whiteSpace:"pre-wrap"}}>{h.notes}</div>}
              </div>
              <div style={{textAlign:"right",minWidth:90}}>{h.next_date&&<><div style={{fontSize:9.5,color:"var(--silver)",textTransform:"uppercase",fontWeight:700,marginBottom:3}}>Next date</div><Bdg label={fmt(h.next_date)} color={daysUntil(h.next_date)<0?"#c0392b":"#1a8a7a"}/></>}</div>
            </div>;
          })}
        </div>
      </div>
    );
  };

  const CalendarView = () => {
    const [calendarCases,setCalendarCases]=useState([]);
    const [calendarLoading,setCalendarLoading]=useState(false);
    const [calendarError,setCalendarError]=useState("");
    const [calendarMode,setCalendarMode]=useState("month");
    const y=calMo.getFullYear(),m=calMo.getMonth();
    const firstDate=`${y}-${String(m+1).padStart(2,"0")}-01`;
    const nextMonth=new Date(y,m+1,1);
    const nextDate=`${nextMonth.getFullYear()}-${String(nextMonth.getMonth()+1).padStart(2,"0")}-01`;

    useEffect(()=>{
      let cancelled=false;
      const loadCalendarCases=async()=>{
        setCalendarLoading(true); setCalendarError("");
        try{
          // IMPORTANT: fetch only the displayed month. The lightweight sb wrapper
          // does not implement gte/lt chaining, so the calendar uses PostgREST
          // directly rather than downloading the entire case table.
          const qs=[
            "select=*",
            "date_next_list=gte."+encodeURIComponent(firstDate),
            "date_next_list=lt."+encodeURIComponent(nextDate),
            "order=date_next_list.asc,court_no_desg_name.asc,petparty_name.asc"
          ].join("&");
          const r=await fetch(SB_URL+"/rest/v1/cases?"+qs,{
            headers:{apikey:SB_KEY,Authorization:"Bearer "+((await authClient.auth.getSession()).data.session.access_token),Accept:"application/json"}
          });
          const j=await r.json();
          if(!r.ok) throw new Error(j?.message||j?.hint||"Calendar query failed");
          const active=(Array.isArray(j)?j:[]).filter(c=>String(c.case_status||"Pending").trim().toLowerCase()!=="decided");
          if(!cancelled) setCalendarCases(active);
        }catch(e){
          if(!cancelled){setCalendarCases([]);setCalendarError(e.message||"Could not load cause list");}
        }finally{if(!cancelled)setCalendarLoading(false);}
      };
      loadCalendarCases();
      return()=>{cancelled=true};
    },[firstDate,nextDate]);

    const firstDay=new Date(y,m,1).getDay();
    const daysInMo=new Date(y,m+1,0).getDate();
    const normalizeDate=d=>d?String(d).slice(0,10):"";
    const byDate={};
    calendarCases.forEach(c=>{
      const d=normalizeDate(c.date_next_list);
      if(d&&d.slice(0,7)===y+"-"+String(m+1).padStart(2,"0")){
        if(!byDate[d])byDate[d]=[];
        byDate[d].push(c);
      }
    });
    Object.values(byDate).forEach(list=>list.sort((a,b)=>partyLabel(a).localeCompare(partyLabel(b))));
    const cells=[];
    for(let i=0;i<firstDay;i++)cells.push(null);
    for(let d=1;d<=daysInMo;d++)cells.push(d);
    return (
      <div className="fade-up" style={{display:"flex",flexDirection:"column",gap:10,height:"100%"}}>
        <div style={{display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:10,flexWrap:"wrap"}}>
            <div>
              <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:20,fontWeight:700,margin:"0 0 4px"}}>Hearing Calendar</h2>
              <div style={{fontSize:11,color:"var(--silver)"}}>Your upcoming court dates, organised by month</div>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              <Btn sm v="teal" onClick={()=>window.open("https://ecourtsindia.com/causelist","_blank","noopener,noreferrer")}>📋 Live Cause List</Btn>
              <Btn sm v="ghost" onClick={()=>window.open("https://districts.ecourts.gov.in/haryana/karnal","_blank","noopener,noreferrer")}>Karnal eCourts ↗</Btn>
              <Btn sm v="ghost" onClick={()=>window.open("https://districts.ecourts.gov.in/haryana/ambala","_blank","noopener,noreferrer")}>Ambala eCourts ↗</Btn>
            </div>
          </div>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,flexWrap:"wrap",background:"var(--paper)",border:"1px solid var(--border)",borderRadius:12,padding:8}}>
            <div style={{display:"flex",alignItems:"center",gap:6}}>
              <Btn sm v="ghost" onClick={()=>setCalMo(new Date(y,m-1,1))}>‹</Btn>
              <div style={{fontWeight:750,fontSize:15,minWidth:145,textAlign:"center"}}>{calMo.toLocaleString("en-IN",{month:"long",year:"numeric"})}</div>
              <Btn sm v="ghost" onClick={()=>setCalMo(new Date(y,m+1,1))}>›</Btn>
              <Btn sm v="gold" onClick={()=>setCalMo(new Date())}>Today</Btn>
            </div>
            <div style={{display:"flex",gap:4,padding:3,borderRadius:9,background:"white",border:"1px solid var(--border)"}}>
              <button onClick={()=>setCalendarMode("month")} style={{border:0,borderRadius:7,padding:"7px 12px",fontSize:11,fontWeight:700,cursor:"pointer",background:calendarMode==="month"?"var(--navy)":"transparent",color:calendarMode==="month"?"white":"var(--ink3)"}}>Month</button>
              <button onClick={()=>setCalendarMode("agenda")} style={{border:0,borderRadius:7,padding:"7px 12px",fontSize:11,fontWeight:700,cursor:"pointer",background:calendarMode==="agenda"?"var(--navy)":"transparent",color:calendarMode==="agenda"?"white":"var(--ink3)"}}>Agenda</button>
            </div>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(125px,1fr))",gap:8}}>
            <div style={{background:"#eef8f5",border:"1px solid #d4eee5",borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:10,color:"#387a68",fontWeight:700}}>HEARINGS THIS MONTH</div><div style={{fontSize:22,fontWeight:800,color:"#176b58"}}>{calendarCases.length}</div></div>
            <div style={{background:"#fff7e8",border:"1px solid #f5e4bd",borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:10,color:"#9a6a18",fontWeight:700}}>DATES WITH HEARINGS</div><div style={{fontSize:22,fontWeight:800,color:"#875a0c"}}>{Object.keys(byDate).length}</div></div>
            <div style={{background:"#f2f5fb",border:"1px solid #dfe6f3",borderRadius:10,padding:"10px 12px"}}><div style={{fontSize:10,color:"#586d91",fontWeight:700}}>BUSIEST DAY</div><div style={{fontSize:15,fontWeight:800,color:"#344b73"}}>{Object.entries(byDate).sort((a,b)=>b[1].length-a[1].length)[0]?.[0] ? fmt(Object.entries(byDate).sort((a,b)=>b[1].length-a[1].length)[0][0]) : "—"}</div></div>
          </div>
        </div>
        {calendarError&&<Card p={10} style={{border:"1px solid #f59e0b",background:"#fffbeb",color:"#92400e",fontSize:11}}>⚠️ Cause list could not be loaded: {calendarError}</Card>}
        {calendarLoading&&<Card p={10} style={{fontSize:11,color:"var(--silver)"}}>⏳ Loading hearings for {calMo.toLocaleString("en-IN",{month:"long",year:"numeric"})}…</Card>}
        {!calendarLoading&&!calendarError&&calendarCases.length===0&&<Card p={12} style={{textAlign:"center",color:"var(--silver)",fontSize:11}}>No pending/active cases are scheduled in {calMo.toLocaleString("en-IN",{month:"long",year:"numeric"})}.</Card>}
        {calendarMode==="month"&&<Card p={0} style={{overflow:"hidden"}}>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:"1px solid var(--border)"}}>
            {["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(d=><div key={d} style={{textAlign:"center",padding:"6px 2px",fontSize:9.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase"}}>{d}</div>)}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)"}}>
            {cells.map((day,i)=>{
              if(!day)return<div key={`e${i}`} style={{minHeight:68,borderBottom:"1px solid var(--border)",borderRight:"1px solid var(--border)",background:"#f9fafb"}}/>;
              const ds=`${y}-${String(m+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
              const isToday=ds===TODAY;
              const hearings=byDate[ds]||[];
              return <div key={day} style={{minHeight:68,borderBottom:"1px solid var(--border)",borderRight:"1px solid var(--border)",padding:5,background:isToday?"#fffbef":hearings.length?"#f9fff9":""}}>
                <div style={{width:20,height:20,borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",marginBottom:3,fontSize:11,fontWeight:isToday?700:400,background:isToday?"var(--gold)":"transparent",color:isToday?"white":"var(--ink3)"}}>{day}</div>
                {hearings.slice(0,2).map(h=>{const t=tm(h.type_name);return<div key={h.cino} onClick={()=>openCase(h)} style={{fontSize:9,padding:"1px 3px",borderRadius:3,marginBottom:2,background:t.color+"1a",color:t.color,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontWeight:500,cursor:"pointer"}}>{h.resparty_name==="XXXXXXX"?(h.note||h.type_name):h.resparty_name}</div>;})}
                {hearings.length>2&&<div style={{fontSize:8.5,color:"var(--silver)"}}>+{hearings.length-2}</div>}
              </div>;
            })}
          </div>
        </Card>}
        <div style={{flex:1,overflowY:"auto",display:calendarMode==="agenda"?"block":"none"}}>
          {Object.entries(byDate).sort(([a],[b])=>a.localeCompare(b)).map(([date,hearings])=>(
            <div key={date} style={{marginBottom:12}}>
              <div style={{fontSize:10.5,fontWeight:700,color:"var(--silver)",textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>
                {fmt(date)}{date===TODAY&&<span style={{color:"var(--rose)",marginLeft:6}}>— TODAY</span>}<span style={{fontWeight:400,marginLeft:6}}>({hearings.length})</span>
              </div>
              <Card p={0} style={{overflow:"hidden"}}>
                {hearings.map((c,i)=>{const t=tm(c.type_name);return(
                  <div key={c.cino} style={{padding:"9px 14px",borderBottom:i<hearings.length-1?"1px solid var(--border)":"none",display:"flex",alignItems:"center",gap:10,cursor:"pointer"}}
                    onClick={()=>openCase(c)} onMouseEnter={e=>e.currentTarget.style.background="var(--paper)"} onMouseLeave={e=>e.currentTarget.style.background=""}>
                    <div style={{flex:1,minWidth:0}}><div style={{fontSize:12.5,fontWeight:500,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{partyLabel(c)}</div><div style={{fontSize:10.5,color:"var(--silver)",marginTop:1}}>{c.court_no_desg_name} · {c.establishment_name}</div></div>
                    <Bdg label={t.label} color={t.color}/><Bdg label={c.purpose_name} color={pcColor(c.purpose_name)}/>
                  </div>
                );})}
              </Card>
            </div>
          ))}
        </div>
        {detail&&<DetailPanel c={detail} onClose={()=>setDetail(null)}/>}
      </div>
    );
  };

  // ── TASKS ────────────────────────────────────────────────────────────────
  const TasksView = () => {
    const [taskSearch,setTaskSearch]=useState("");
    const [taskScope,setTaskScope]=useState("pending");
    const filteredTasks=useMemo(()=>{
      const q=taskSearch.trim().toLowerCase();
      return [...tasks].filter(t=>{
        const c=cases.find(x=>x.cino===t.cino);

  // ── CASE INTELLIGENCE / OFFICE DESK / BACKUP ─────────────────────────────

    const pendingTasks=tasks.filter(t=>!t.done).sort((a,b)=>(a.due||"9999-99-99").localeCompare(b.due||"9999-99-99"));
