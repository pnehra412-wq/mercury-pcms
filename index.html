      {!busy&&!matches.length&&<div style={{padding:20,textAlign:"center",color:"var(--silver)",fontSize:12}}>No case matches this search.</div>}</Card>
      <Card p={12}><div style={{fontWeight:800,fontSize:13,marginBottom:5}}>e-Courts Order Inbox</div><div style={{fontSize:10.5,color:"var(--silver)",lineHeight:1.5,marginBottom:9}}>Orders imported from your downloads or shared to Mercury appear here. Opening an unprocessed stored PDF triggers analysis; Mercury updates a case only when the match is sufficiently confident.</div>{docs.filter(d=>String(d.doc_type||"").toLowerCase().includes("order")||String(d.source||"").toLowerCase().includes("ecourts")||!d.cino).slice(0,20).map(d=><div key={d.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 0",borderTop:"1px solid var(--border)"}}><div style={{flex:1,minWidth:0}}><div style={{fontSize:11.5,fontWeight:700,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{d.name||"Court order PDF"}</div><div style={{fontSize:10,color:"var(--silver)",marginTop:3}}>{d.cino||"Case not matched"} · {d.processing_status||"Not analysed"} · {d.uploaded_at?fmt(d.uploaded_at.slice(0,10)):""}</div>{d.ai_summary&&<div style={{fontSize:10.5,color:"var(--ink3)",marginTop:3}}>{d.ai_summary}</div>}</div><Btn sm v="ghost" onClick={()=>openOrderFile(d)}>{d.storage_path?"Open / analyse":"Open case"}</Btn></div>)}{!docs.some(d=>String(d.doc_type||"").toLowerCase().includes("order")||String(d.source||"").toLowerCase().includes("ecourts")||!d.cino)&&<div style={{fontSize:11,color:"var(--silver)",padding:"8px 0"}}>No court orders in the inbox yet. In a case's Docs tab, select <b>Order</b> before uploading the e-Courts PDF.</div>}</Card>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:12}}>
      <Card p={12}><div style={{fontWeight:800,fontSize:13,marginBottom:8}}>Next actions required</div>{pendingTasks.slice(0,8).map(t=>{const cc=cases.find(x=>x.cino===t.cino);return <div key={t.id} style={{padding:"8px 0",borderTop:"1px solid var(--border)",fontSize:11.5}}><b>{t.title}</b><div style={{color:"var(--silver)",marginTop:3}}>Due {fmt(t.due)} · {cc?partyLabel(cc):t.cino||"Unlinked task"}</div></div>;})}{!pendingTasks.length&&<div style={{fontSize:11,color:"var(--silver)"}}>No pending tasks recorded.</div>}<div style={{fontWeight:800,fontSize:12,margin:"12px 0 6px"}}>Upcoming hearings</div>{upcoming.slice(0,6).map(c=><button key={c.id} onClick={()=>openCase(c)} style={{display:"flex",justifyContent:"space-between",gap:8,width:"100%",textAlign:"left",padding:"7px 0",border:0,borderTop:"1px solid var(--border)",background:"transparent",cursor:"pointer",fontSize:11}}><span>{partyLabel(c)}</span><b>{fmt(c.date_next_list)}</b></button>)}</Card>
      <Card p={12}><div style={{fontWeight:800,fontSize:13,marginBottom:4}}>Export & recovery</div><div style={{fontSize:11,color:"var(--silver)",lineHeight:1.6,marginBottom:10}}>Export cases, uploaded document contents, hearing history, tasks, fees, order analyses and activity into a portable JSON backup. Keep copies securely outside this device.</div><Btn v="gold" onClick={exportBackup} disabled={busyBackup}>{busyBackup?<Spin/>:<Ic n="download" size={13}/>}Export full workspace backup</Btn><div style={{fontSize:10,color:"var(--silver)",lineHeight:1.5,marginTop:8}}>This creates a backup file; it does not automatically restore a database. Retain Supabase-managed backups as a second recovery layer. The file may contain confidential client data.</div><div style={{fontWeight:800,fontSize:12,margin:"15px 0 7px"}}>Recent activity</div>{activity.slice(0,8).map(a=><div key={a.id} style={{padding:"7px 0",borderTop:"1px solid var(--border)",fontSize:10.5}}><b>{a.summary||a.action}</b><div style={{color:"var(--silver)",marginTop:2}}>{a.cino||"Workspace"} · {a.created_at?new Date(a.created_at).toLocaleString("en-IN"):""}</div></div>)}{!activity.length&&!busy&&<div style={{fontSize:10.5,color:"var(--silver)"}}>Order processing and document changes will appear here.</div>}</Card></div>
    </div>;
  };

  // ── MODALS ───────────────────────────────────────────────────────────────
  const AddTaskModal = () => {
    const [form,setForm]=useState({title:"",cino:addTask==="__free__"?"":addTask||"",due:TODAY,priority:"Normal"});
    const [saving,setSaving]=useState(false);
    const add=async()=>{if(!form.title)return;setSaving(true);const res=await sb.from("tasks").insert({...form,user_id:authUser.id,done:false});if(Array.isArray(res)&&res.length>0){setTasks(ts=>[...ts,...res]);await logActivity(form.cino||null,"task_created","Created task: "+form.title,{due:form.due,priority:form.priority});}setAddTask(null);notify("✅ Task saved");setSaving(false);};
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(13,17,23,0.42)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&setAddTask(null)}>
        <div className="fade-up" style={{background:"var(--white)",borderRadius:12,width:"100%",maxWidth:460,padding:22,boxShadow:"var(--shadow-lg)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:16}}>Add Task</h2><button onClick={()=>setAddTask(null)} style={{border:"none",background:"var(--paper)",borderRadius:6,padding:5,cursor:"pointer"}}><Ic n="x" size={14}/></button></div>
          <div style={{display:"grid",gap:10}}>
            <div><Lbl c="Task Title"/><input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} style={iS} placeholder="e.g. File bail application…"/></div>
            <div><Lbl c="Linked Case"/><select value={form.cino} onChange={e=>setForm(f=>({...f,cino:e.target.value}))} style={iS}><option value="">— None —</option>{cases.map(c=><option key={c.cino} value={c.cino}>{c.cino} · {partyLabel(c).slice(0,40)}</option>)}</select></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
              <div><Lbl c="Due"/><input type="date" value={form.due} onChange={e=>setForm(f=>({...f,due:e.target.value}))} style={iS}/></div>
              <div><Lbl c="Priority"/><select value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))} style={iS}>{["High","Normal","Low"].map(p=><option key={p}>{p}</option>)}</select></div>
            </div>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><Btn v="ghost" onClick={()=>setAddTask(null)}>Cancel</Btn><Btn onClick={add}>{saving?<Spin/>:<Ic n="plus" size={13}/>}Save Task</Btn></div>
        </div>
      </div>
    );
  };

  const AddFeeModal = () => {
    const [form,setForm]=useState({client_name:"",cino:"",description:"",amount_agreed:0,amount_paid:0,date_received:TODAY});
    const [saving,setSaving]=useState(false);
    const add=async()=>{setSaving(true);const res=await sb.from("fees").insert({...form,user_id:authUser.id});if(Array.isArray(res)&&res.length>0){setFees(f=>[...f,...res]);await logActivity(form.cino||null,"fee_entry_created","Created fee ledger entry",{client_name:form.client_name,amount_agreed:form.amount_agreed,amount_paid:form.amount_paid});}setAddFee(null);notify("✅ Fee saved");setSaving(false);};
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(13,17,23,0.42)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&setAddFee(null)}>
        <div className="fade-up" style={{background:"var(--white)",borderRadius:12,width:"100%",maxWidth:480,padding:22,boxShadow:"var(--shadow-lg)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:16}}>Add Fee Entry</h2><button onClick={()=>setAddFee(null)} style={{border:"none",background:"var(--paper)",borderRadius:6,padding:5,cursor:"pointer"}}><Ic n="x" size={14}/></button></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Lbl c="Client Name"/><input value={form.client_name} onChange={e=>setForm(f=>({...f,client_name:e.target.value}))} style={iS} placeholder="Name"/></div>
            <div><Lbl c="Date"/><input type="date" value={form.date_received} onChange={e=>setForm(f=>({...f,date_received:e.target.value}))} style={iS}/></div>
            <div style={{gridColumn:"1/-1"}}><Lbl c="Description"/><input value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} style={iS} placeholder="Retainer / Hearing fee / etc."/></div>
            <div style={{gridColumn:"1/-1"}}><Lbl c="Linked Case"/><select value={form.cino} onChange={e=>setForm(f=>({...f,cino:e.target.value}))} style={iS}><option value="">— None —</option>{cases.map(c=><option key={c.cino} value={c.cino}>{c.cino} · {partyLabel(c).slice(0,40)}</option>)}</select></div>
            <div><Lbl c="Amount Agreed (₹)"/><input type="number" value={form.amount_agreed} onChange={e=>setForm(f=>({...f,amount_agreed:Number(e.target.value)}))} style={iS}/></div>
            <div><Lbl c="Amount Paid (₹)"/><input type="number" value={form.amount_paid} onChange={e=>setForm(f=>({...f,amount_paid:Number(e.target.value)}))} style={iS}/></div>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><Btn v="ghost" onClick={()=>setAddFee(null)}>Cancel</Btn><Btn onClick={add}>{saving?<Spin/>:<Ic n="fee" size={13}/>}Save to Cloud</Btn></div>
        </div>
      </div>
    );
  };

  const AddCaseModal = () => {
    const [form,setForm]=useState({cino:"",type_name:"CS",petparty_name:"",resparty_name:"",establishment_name:"",district_name:"Karnal",date_next_list:"",court_no_desg_name:"",purpose_name:"Appearance",note:"",case_status:"Pending"});
    const [saving,setSaving]=useState(false);
    const add=async()=>{if(!form.cino||!form.petparty_name)return;setSaving(true);const res=await sb.from("cases").insert({...form,user_id:authUser.id,case_status:"Pending"});if(Array.isArray(res)&&res.length>0){setCases(cs=>[...cs,...res]);await logActivity(form.cino,"case_created","Created case record",{case_type:form.type_name});}setAddCase(false);notify("✅ Case saved");setSaving(false);};
    return (
      <div style={{position:"fixed",inset:0,background:"rgba(13,17,23,0.42)",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:16}} onClick={e=>e.target===e.currentTarget&&setAddCase(false)}>
        <div className="fade-up" style={{background:"var(--white)",borderRadius:12,width:"100%",maxWidth:520,padding:22,boxShadow:"var(--shadow-lg)",maxHeight:"90vh",overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={{fontFamily:"'Playfair Display',serif",fontSize:16}}>Add New Case</h2><button onClick={()=>setAddCase(false)} style={{border:"none",background:"var(--paper)",borderRadius:6,padding:5,cursor:"pointer"}}><Ic n="x" size={14}/></button></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div><Lbl c="CNR Number"/><input value={form.cino} onChange={e=>setForm(f=>({...f,cino:e.target.value}))} style={iS} placeholder="HRKR…"/></div>
            <div><Lbl c="Case Type"/><select value={form.type_name} onChange={e=>setForm(f=>({...f,type_name:e.target.value}))} style={iS}>{["CS","CHI","NDPS","NACT","COMI","HMA","MNT125","MACP","EXE","CRA","CA","SC","SUMM","PCH"].map(t=><option key={t}>{t}</option>)}</select></div>
            <div><Lbl c="Petitioner"/><input value={form.petparty_name} onChange={e=>setForm(f=>({...f,petparty_name:e.target.value}))} style={iS}/></div>
            <div><Lbl c="Respondent"/><input value={form.resparty_name} onChange={e=>setForm(f=>({...f,resparty_name:e.target.value}))} style={iS}/></div>
            <div><Lbl c="Court"/><input value={form.court_no_desg_name} onChange={e=>setForm(f=>({...f,court_no_desg_name:e.target.value}))} style={iS} placeholder="JM-1st Class…"/></div>
            <div><Lbl c="District"/><select value={form.district_name} onChange={e=>setForm(f=>({...f,district_name:e.target.value}))} style={iS}>{["Karnal","Ambala","Kurukshetra","Sonepat","Chandigarh","Yamunanagar","Panipat"].map(d=><option key={d}>{d}</option>)}</select></div>
            <div style={{gridColumn:"1/-1"}}><Lbl c="Establishment"/><input value={form.establishment_name} onChange={e=>setForm(f=>({...f,establishment_name:e.target.value}))} style={iS} placeholder="Criminal Courts, Karnal"/></div>
            <div><Lbl c="Next Hearing"/><input type="date" value={form.date_next_list} onChange={e=>setForm(f=>({...f,date_next_list:e.target.value}))} style={iS}/></div>
            <div><Lbl c="Purpose"/><input value={form.purpose_name} onChange={e=>setForm(f=>({...f,purpose_name:e.target.value}))} style={iS}/></div>
            <div style={{gridColumn:"1/-1"}}><Lbl c="Note"/><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} style={iS} placeholder="e.g. Komal vs Kapil"/></div>
          </div>
          <div style={{display:"flex",gap:8,justifyContent:"flex-end",marginTop:14}}><Btn v="ghost" onClick={()=>setAddCase(false)}>Cancel</Btn><Btn onClick={add}>{saving?<Spin/>:<Ic n="save" size={13}/>}Save to Supabase</Btn></div>
        </div>
      </div>
    );
  };

  if(!authReady)return <div style={{minHeight:"100vh",display:"grid",placeItems:"center",background:"#0d1117",color:"#e8c96a"}}>Loading secure Mercury session…</div>;
  if(!authUser)return <div style={{minHeight:"100vh",display:"grid",placeItems:"center",background:"#0d1117",padding:20}}><form onSubmit={signIn} style={{width:"100%",maxWidth:420,background:"#1c2333",border:"1px solid #66562e",borderRadius:16,padding:28}}><h1 style={{color:"#e8c96a",fontSize:25}}>⚖ MERCURY PCMS</h1><p style={{color:"#c8d3e0",fontSize:13,margin:"10px 0 22px"}}>Secure sign-in. Public registration is disabled.</p><label style={{color:"#c8d3e0",fontSize:12}}>Email</label><input type="email" required autoComplete="username" value={authEmail} onChange={e=>setAuthEmail(e.target.value)} style={{display:"block",width:"100%",padding:12,margin:"6px 0 14px",borderRadius:8}}/><label style={{color:"#c8d3e0",fontSize:12}}>Password</label><input type="password" required autoComplete="current-password" value={authPassword} onChange={e=>setAuthPassword(e.target.value)} style={{display:"block",width:"100%",padding:12,margin:"6px 0 14px",borderRadius:8}}/>{authError&&<p style={{color:"#ff9b91",fontSize:12}}>{authError}</p>}<button disabled={authBusy} style={{width:"100%",padding:12,border:0,borderRadius:8,background:"#c9a84c",fontWeight:800}}>{authBusy?"Signing in…":"Sign in securely"}</button></form></div>;
  // ── LAYOUT ───────────────────────────────────────────────────────────────
  return (
    <div style={{display:"flex",height:"100vh",overflow:"hidden",background:"var(--paper)"}}>
      {/* Sidebar */}
      <nav className="mercury-sidebar" style={{width:175,minWidth:175,flexShrink:0,background:"#141b27",display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
        <div style={{padding:"14px 14px 12px",borderBottom:"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{fontFamily:"'Playfair Display',serif",fontWeight:900,fontSize:18,background:"linear-gradient(135deg,#c9a84c,#e8c96a)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>⚖ MERCURY</div>
          <div style={{fontSize:9,color:"#8b9cb0",letterSpacing:"0.12em",textTransform:"uppercase",marginTop:3}}>PCMS · Adv. Pardeep</div>
        </div>
        <div style={{flex:1,paddingTop:4}}>
          {NAV.map(n=>(
            <div key={n.id} style={{display:"flex",alignItems:"center",gap:8,padding:"9px 14px",cursor:"pointer",transition:"all 0.15s",background:view===n.id?"rgba(201,168,76,0.12)":"transparent",borderLeft:view===n.id?"3px solid #c9a84c":"3px solid transparent",color:view===n.id?"#e8c96a":"#8b9cb0",fontSize:12,fontWeight:view===n.id?600:400}}
              onClick={()=>{setView(n.id);if(n.id!=="cases")setDetail(null);}}>
              <Ic n={n.icon} size={14} color={view===n.id?"#e8c96a":"#8b9cb0"}/>
              {n.label}
              {n.id==="tasks"&&pendTasks.length>0&&<span style={{marginLeft:"auto",background:"#1a8a7a",color:"white",borderRadius:8,padding:"0 5px",fontSize:9.5,fontWeight:700}}>{pendTasks.length}</span>}
              {n.id==="dashboard"&&next7.length>0&&<span style={{marginLeft:"auto",background:"#d4891a",color:"white",borderRadius:8,padding:"0 5px",fontSize:9.5,fontWeight:700}}>{next7.length}</span>}
            </div>
          ))}
        </div>
        <div style={{padding:"10px 14px",borderTop:"1px solid rgba(255,255,255,0.07)"}}>
          <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:6}}>
            <div style={{width:26,height:26,borderRadius:"50%",background:"linear-gradient(135deg,#c9a84c,#e8c96a)",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700,fontSize:11,color:"#0d1117",flexShrink:0}}>P</div>
            <div><div style={{color:"#fff",fontWeight:600,fontSize:11.5}}>Adv. Pardeep</div><div style={{fontSize:9,color:"#8b9cb0"}}>Haryana Bar</div></div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:5}}>
            <div style={{width:6,height:6,borderRadius:"50%",background:loading?"#f59e0b":cases.length>0?"#22c55e":"#ef4444"}}/>
            <span style={{fontSize:9,color:"#8b9cb0"}}>{cases.length>0?`${cases.length} cases in cloud`:"Connecting…"}</span>
          </div>
        </div>
      </nav>

      {/* Main */}
      <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        <div className="mercury-topbar" style={{background:"var(--white)",borderBottom:"1px solid var(--border)",padding:"10px 18px",display:"flex",alignItems:"center",gap:12,flexShrink:0,boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
          <span style={{fontSize:10,color:"var(--silver)"}}>{authUser.email}</span><button onClick={signOut} style={{border:"1px solid var(--border)",borderRadius:7,padding:"7px 10px",background:"var(--white)",fontSize:11}}>Sign out</button>
          <div className="mercury-search" style={{flex:1,maxWidth:340,display:"flex",alignItems:"center",gap:7,background:"var(--paper)",border:"1px solid var(--border)",borderRadius:7,padding:"6px 11px"}}>
            <Ic n="search" size={13} color="var(--silver)"/>
            <input style={{border:"none",background:"transparent",outline:"none",fontSize:12.5,color:"var(--ink)",flex:1}} placeholder="Search CNR, party, type…" value={searchQ} onChange={e=>{setSearchQ(e.target.value);if(e.target.value)setView("cases");}}/>
            {searchQ&&<button onClick={()=>setSearchQ("")} style={{border:"none",background:"transparent",cursor:"pointer"}}><Ic n="x" size={12} color="var(--silver)"/></button>}
          </div>
          {todayCases.length>0&&(
            <div style={{display:"flex",alignItems:"center",gap:6,background:"#fff2f2",border:"1px solid rgba(192,57,43,0.22)",borderRadius:7,padding:"5px 10px",fontSize:11.5,color:"var(--rose)",fontWeight:700,cursor:"pointer",animation:"pulse 2s infinite"}} onClick={()=>setView("calendar")}>
              <Ic n="alert" size={12} color="var(--rose)"/>{todayCases.length} hearing{todayCases.length>1?"s":""} today
            </div>
          )}
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:loading?"#f59e0b":"#22c55e"}}/>
            <span className="mercury-status-text" style={{fontSize:10.5,color:"var(--silver)"}}>{loading?"Syncing…":"Supabase ✓"}</span>
          </div>
          <div className="mercury-today" style={{fontSize:11,color:"var(--silver)",whiteSpace:"nowrap"}}>{new Date().toLocaleDateString("en-IN",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</div>
        </div>

        <div className="mercury-main-pad" style={{flex:1,overflow:"hidden",padding:"14px 18px",display:"flex",flexDirection:"column"}}>
          {view==="dashboard"  &&<Dashboard/>}
          {view==="cases"      &&<CasesView/>}
          {view==="calendar"   &&<CalendarView/>}
          {view==="diary"      &&<DiaryView/>}
          {view==="tasks"      &&<TasksView/>}
          {view==="fees"       &&<FeesView/>}
          {view==="analytics"  &&<AnalyticsView/>}
          {view==="office"     &&<OfficeView/>}
        </div>
      </div>

      {addTask&&<AddTaskModal/>}
      {addFee&&<AddFeeModal/>}
      {addCase&&<AddCaseModal/>}


      {/* Mobile navigation */}
      <nav className="mercury-mobile-nav" aria-label="Mercury mobile navigation">
        {[{id:"dashboard",icon:"home",label:"Home"},{id:"calendar",icon:"cal",label:"Calendar"},{id:"diary",icon:"history",label:"Diary"},{id:"cases",icon:"search",label:"Search"}].map((n,i)=>(
          <button key={i} className={view===n.id ? "active":""} aria-current={view===n.id ? "page":undefined} onClick={()=>{const targetView=n.id==="cases"?"cases":n.id;setView(targetView);setDetail(null);if(n.id==="cases"){const input=document.querySelector(".mercury-topbar .mercury-search input");if(input){input.focus();input.scrollIntoView({block:"nearest"});}}}}>
            <Ic n={n.icon} size={18}/><span>{n.label}</span>
          </button>
        ))}
      </nav>

      {toast&&<div style={{position:"fixed",bottom:18,right:18,background:"#1c2333",color:"#fff",padding:"10px 16px",borderRadius:9,fontSize:12.5,fontWeight:500,boxShadow:"var(--shadow-lg)",borderLeft:`4px solid ${toast.color}`,animation:"fadeUp 0.25s ease",zIndex:400}}>{toast.msg}</div>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(MercuryPCMS));
</script>
</body>
</html>
